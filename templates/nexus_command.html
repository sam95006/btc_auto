<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700;900&display=swap");

    :root {
      --bg: #081320;
      --panel: rgba(7, 18, 34, 0.92);
      --panel-soft: rgba(7, 18, 34, 0.82);
      --line: rgba(79, 216, 255, 0.22);
      --line-strong: rgba(79, 216, 255, 0.5);
      --cyan: #4fd8ff;
      --white: #eefaff;
      --muted: rgba(238, 250, 255, 0.76);
      --red: #ff3b5c;
      --gold: #f7931a;
      --eth: #8a7fff;
      --sol: #29e0d0;
      --pepe: #00ff88;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.34);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Outfit", "Noto Sans TC", sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(18, 55, 82, 0.45), transparent),
        linear-gradient(165deg, #0a1a2e 0%, #071320 48%, #040a14 100%);
    }

    body.alert-active {
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(64, 12, 20, 0.35), transparent),
        linear-gradient(165deg, #1a0a12 0%, #071320 55%, #040a14 100%);
    }

    button, input, textarea {
      font: inherit;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .top-status-bar,
    .meeting-log-panel,
    .alert-panel,
    .dock-window,
    .main-scene-schedule,
    .status-cell,
    .info-card,
    .station-context-card,
    .metric-box,
    .scene-reason-card,
    .meeting-badge,
    .unit-report-card,
    .reject-summary-card,
    .role-window-card,
    .news-item-card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .top-status-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(3, 7, 18, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(79, 216, 255, 0.15);
      border-radius: 999px;
      pointer-events: auto;
      justify-content: center;
      width: auto;
      max-width: min(calc(100vw - 360px), 1080px);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .status-cell {
      padding: 2px 8px;
      background: transparent;
      border: none;
      border-radius: 0;
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 6px;
      min-height: auto;
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .status-cell:last-child {
      border-right: none;
    }

    .status-cell span,
    .alert-panel span,
    .metric-box span,
    .scene-eyebrow,
    .scene-reason-card h3,
    .info-card h3,
    .station-context-card h3,
    .role-window-section span,
    .dock-label {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-cell strong,
    .metric-box b {
      display: inline-block;
      margin-top: 0;
      font-size: 12px;
      line-height: 1;
      color: var(--cyan);
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .status-cell.good strong { color: var(--pepe); }
    .status-cell.bad strong { color: var(--red); }

    .main-scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .reference-scene {
      position: absolute;
      inset: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-color: #071327;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.42);
    }

    .missing-art {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 10px;
      text-align: center;
      color: rgba(238, 250, 255, 0.82);
      pointer-events: none;
    }

    .missing-art b { font-size: 22px; }
    .missing-art span { color: var(--cyan); }

    .main-scene-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .main-scene-schedule {
      position: absolute;
      right: 24px;
      top: 108px;
      width: min(420px, calc(100vw - 48px));
      padding: 16px 18px;
      border-radius: 20px;
      pointer-events: auto;
    }

    .main-scene-schedule h2,
    .log-panel-header h2,
    .detail-panel-header h3,
    .dock-header strong {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .main-scene-schedule p,
    .log-panel-header p,
    .scene-subtitle,
    .detail-panel-header p,
    .scene-reason-card p,
    .info-card p,
    .station-summary,
    .station-chat-row p,
    .unit-report-card p,
    .reject-summary-card p,
    .news-item-card p,
    .news-item-card small,
    .role-window-section p,
    .meeting-badge span,
    .workspace-stage-hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .meeting-slot-grid,
    .detail-nav-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .meeting-slot-button,
    .detail-nav-button,
    .dock-tab,
    .dock-action,
    .role-list-item,
    .scene-hotspot-block {
      border: 1px solid rgba(79, 216, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: var(--white);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s, transform 0.18s;
    }

    .meeting-slot-button:hover,
    .detail-nav-button:hover,
    .dock-tab:hover,
    .dock-action:hover,
    .role-list-item:hover,
    .scene-hotspot-block:hover,
    .detail-nav-button.active,
    .dock-tab.active,
    .role-list-item.active {
      border-color: rgba(79, 216, 255, 0.54);
      background: rgba(79, 216, 255, 0.12);
      box-shadow: 0 0 28px rgba(79, 216, 255, 0.16);
    }

    .meeting-slot-button {
      display: grid;
      gap: 6px;
      padding: 14px;
      text-align: left;
      border-radius: 16px;
    }

    .meeting-slot-button strong {
      font-size: 15px;
      color: var(--cyan);
      letter-spacing: 1px;
    }

    .meeting-slot-button span {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .image-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      border: 1px solid transparent;
      background: rgba(4, 10, 20, 0);
      cursor: pointer;
      z-index: 8;
    }

    .image-hotspot:hover {
      border-color: rgba(79, 216, 255, 0.6);
      background: rgba(79, 216, 255, 0.06);
    }

    .image-hotspot-label {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 9;
      min-width: 110px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(4, 10, 20, 0.56);
      text-align: center;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .image-hotspot-label b {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .image-hotspot-label small {
      display: block;
      color: rgba(238, 250, 255, 0.76);
      font-size: 11px;
      line-height: 1.5;
    }

    .image-hotspot-label.btc b { color: var(--gold); }
    .image-hotspot-label.eth b { color: var(--eth); }
    .image-hotspot-label.sol b { color: var(--sol); }
    .image-hotspot-label.pepe b { color: var(--pepe); }

    .meeting-log-panel {
      position: fixed;
      left: 12px;
      top: 118px;
      bottom: auto;
      z-index: 120;
      pointer-events: auto;
      background: transparent;
      border: none;
      padding: 0;
      width: min(272px, calc(100vw - 24px));
      max-height: min(340px, calc(100vh - 280px));
    }

    .meeting-log-panel .sidebar-block--fill {
      display: block;
    }

    .meeting-log-panel .sidebar-brand-title,
    .meeting-log-panel .sidebar-block-header {
      opacity: 1;
    }

    .decision-strip {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(8, 20, 38, 0.82);
      border: 1px solid rgba(79, 216, 255, 0.14);
      max-height: 180px;
      overflow: auto;
    }
    .decision-strip header {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 8px;
    }
    .decision-strip header strong { font-size: 12px; color: #9fdcff; }
    .decision-strip header small { font-size: 10px; color: rgba(255,255,255,0.55); }
    .decision-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .decision-row { font-size: 11px; display: flex; flex-direction: column; gap: 2px; }
    .decision-row.ok small { color: #6fe7a8; }
    .decision-row.block small { color: #ff8da0; }
    .decision-diagnosis { font-size: 10px; color: rgba(255,220,120,0.9); margin: 0 0 8px; line-height: 1.4; }

    .revenue-kpi {
      margin-bottom: 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(12, 28, 52, 0.55);
      border: 1px solid rgba(120, 200, 255, 0.2);
    }
    .revenue-kpi.good { border-color: rgba(80, 220, 140, 0.45); }
    .revenue-kpi.bad { border-color: rgba(255, 120, 120, 0.4); }
    .revenue-kpi header { margin-bottom: 8px; }
    .revenue-kpi header strong { font-size: 12px; color: #b8e8ff; }
    .revenue-kpi header small { font-size: 10px; color: rgba(255,255,255,0.5); }
    .revenue-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 11px; }
    .revenue-kpi-grid strong { color: #e8f4ff; font-size: 13px; }
    .revenue-kpi-meta { font-size: 10px; color: rgba(255,255,255,0.55); margin: 8px 0 0; line-height: 1.35; }

    .log-panel-header {
      position: sticky;
      top: 0;
      padding-bottom: 10px;
      background: linear-gradient(var(--panel), rgba(7, 18, 34, 0.96));
      z-index: 2;
    }

    .log-list { display: grid; gap: 10px; }

    .log-row {
      display: grid;
      grid-template-columns: 98px 132px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .log-row span { color: var(--cyan); }
    .log-row b { color: #fff; }

    .alert-panel {
      position: absolute;
      right: 18px;
      top: 18px;
      bottom: auto;
      z-index: 140;
      display: grid;
      grid-template-columns: 44px minmax(180px, 240px);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      overflow: auto;
    }

    .alert-orb {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #163440;
      border: 2px solid rgba(79, 216, 255, 0.46);
      box-shadow: inset 0 0 24px rgba(79, 216, 255, 0.22);
    }

    .alert-panel.active { border-color: rgba(255, 59, 92, 0.48); }
    .alert-panel.active .alert-orb {
      background: var(--red);
      border-color: rgba(255, 255, 255, 0.86);
      box-shadow: 0 0 32px rgba(255, 59, 92, 0.42);
    }

    .alert-panel strong {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    .dock-host {
      position: absolute;
      z-index: 110;
    }

    .dock-host.chat-host {
      left: 18px;
      bottom: 18px;
      width: min(520px, calc(100vw - 40px));
    }

    .dock-host.meeting-host {
      right: -380px;
      top: 92px;
      bottom: 18px;
      width: min(360px, calc(100vw - 36px));
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .dock-host.meeting-host.is-open {
      right: 18px;
    }

    .dock-host.meeting-host .dock-window {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .dock-host.meeting-host .dock-body {
      flex: 1;
      overflow: hidden;
    }

    .dock-host.meeting-host .dock-content--free {
      max-height: none;
      height: 100%;
    }

    .right-drawer-handle {
      position: absolute;
      left: -32px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-right: none;
      padding: 24px 8px;
      border-radius: 12px 0 0 12px;
      cursor: pointer;
      z-index: 30;
      color: var(--cyan);
      writing-mode: vertical-rl;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      pointer-events: auto;
      transition: background 0.2s, color 0.2s;
      box-shadow: -4px 0 12px rgba(0,0,0,0.2);
    }
    
    .right-drawer-handle:hover {
      background: rgba(79, 216, 255, 0.12);
      color: #fff;
    }

    .dock-window {
      border-radius: 20px;
      overflow: hidden;
    }

    .dock-window.is-minimized .dock-body {
      display: none;
    }

    .dock-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dock-header strong {
      display: block;
      font-size: 16px;
      margin-top: 4px;
    }

    .dock-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dock-action {
      padding: 8px 12px;
      border-radius: 999px;
    }

    .dock-body {
      display: grid;
      gap: 12px;
      padding: 12px 14px 14px;
    }

    .dock-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dock-tab {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .dock-content {
      max-height: none;
      height: auto;
      overflow: visible;
      display: grid;
      gap: 10px;
    }

    .dock-chat-row,
    .dock-summary-card,
    .station-chat-row,
    .unit-report-card,
    .reject-summary-card,
    .news-item-card {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }

    .dock-chat-row header,
    .station-chat-row header,
    .news-item-card header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      align-items: baseline;
    }

    .dock-chat-row b,
    .station-chat-row b,
    .unit-report-card b,
    .reject-summary-card b,
    .news-item-card b,
    .role-window-card h4 {
      color: #fff;
      margin: 0;
      font-size: 13px;
    }

    .dock-chat-row span,
    .station-chat-row span,
    .news-item-card span {
      color: rgba(238, 250, 255, 0.56);
      font-size: 11px;
    }

    .dock-chat-high b,
    .station-chat-high b { color: #ffd06b; }
    .dock-chat-medium b,
    .station-chat-medium b { color: #8fe8ff; }

    .sidebar-brand,
    .sidebar-block,
    .workspace-card,
    .scene-stage-card,
    .hero-map-card,
    .news-card,
    .role-mini-card,
    .stat-tile {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      border-radius: 18px;
    }

    .sidebar-brand,
    .sidebar-block,
    .workspace-card,
    .scene-stage-card {
      padding: 16px;
    }

    .meeting-log-panel .sidebar-brand,
    .meeting-log-panel .sidebar-block {
      margin-bottom: 12px;
    }

    .sidebar-brand-kicker,
    .workspace-card-header p,
    .stat-tile span,
    .meeting-summary span,
    .data-line div,
    .mini-feed-line p,
    .panel-list,
    .panel-empty,
    .overview-brief p,
    .meeting-columns,
    .chat-line p,
    .role-mini-card p,
    .role-mini-card small,
    .scene-stage-header p,
    .hero-map-header p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .sidebar-brand-title,
    .workspace-card-header h3,
    .scene-stage-header h2,
    .hero-map-header h2 {
      margin: 4px 0 0;
      color: var(--white);
    }

    .sidebar-block-header h3,
    .sidebar-block-header p,
    .workspace-card-header h3,
    .workspace-card-header p,
    .scene-stage-header h2,
    .scene-stage-header p,
    .hero-map-header h2,
    .hero-map-header p {
      margin: 0;
    }

    .sidebar-nav-list,
    .sidebar-section-list,
    .stats-grid,
    .meeting-columns,
    .schedule-grid,
    .decision-focus-list,
    .workspace-board-stack,
    .station-pill-row,
    .role-matrix {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .sidebar-nav-item,
    .sidebar-section-item,
    .schedule-slot-button,
    .role-mini-card {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s, color 0.18s;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-nav-item:hover,
    .sidebar-nav-item.active,
    .sidebar-section-item:hover,
    .sidebar-section-item.active,
    .schedule-slot-button:hover,
    .schedule-slot-button.active,
    .role-mini-card:hover {
      border-color: rgba(79, 216, 255, 0.54);
      background: rgba(79, 216, 255, 0.12);
      box-shadow: 0 0 28px rgba(79, 216, 255, 0.16);
    }

    .workspace-card-body,
    .overview-brief,
    .meeting-summary,
    .scene-home-panel {
      display: grid;
      gap: 12px;
    }

    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat-tile {
      padding: 14px;
    }

    .stat-tile strong {
      display: block;
      margin-top: 8px;
      color: var(--white);
      font-size: 20px;
    }

    .panel-list {
      margin: 0;
      padding-left: 18px;
    }

    .panel-empty {
      margin: 0;
    }

    .data-line,
    .chat-line,
    .mini-feed-line,
    .focus-line,
    .news-card {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }

    .data-line b,
    .chat-line b,
    .mini-feed-line b,
    .focus-line,
    .meeting-summary b,
    .role-mini-card h4,
    .news-card b {
      color: var(--white);
      font-size: 13px;
      margin: 0;
    }

    .chat-line header,
    .meeting-summary header,
    .news-card header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .meeting-columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .station-pill-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .station-pill {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(79, 216, 255, 0.24);
      background: rgba(79, 216, 255, 0.08);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-map-card,
    .scene-stage-card {
      max-width: 760px;
      margin: 88px auto 0;
    }

    .hero-map-stage,
    .scene-stage-frame {
      position: relative;
      margin-top: 12px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(79, 216, 255, 0.22);
      background: rgba(4, 10, 20, 0.42);
    }

    .hero-map-art,
    .scene-stage-art {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-map-hotspots {
      position: absolute;
      inset: 0;
    }

    .map-node-button {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 140px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(79, 216, 255, 0.3);
      background: rgba(4, 10, 20, 0.72);
      color: var(--white);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      text-align: left;
    }

    .map-node-button strong,
    .map-node-button span {
      display: block;
    }

    .map-node-button strong {
      font-size: 12px;
      margin-bottom: 4px;
    }
