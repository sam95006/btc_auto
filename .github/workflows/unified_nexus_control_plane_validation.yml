name: unified-nexus-control-plane-validation

# Stacked on feature/bybit-demo-execution-validation — never binds main/stage3 deploy.
# Read-only Control Plane hardening. No Zeabur deploy. No exchange write.

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/unified-nexus-control-plane"
  pull_request:
    branches:
      - "feature/bybit-demo-execution-validation"

permissions:
  contents: read

concurrency:
  group: unified-control-plane-${{ github.ref }}
  cancel-in-progress: true

env:
  BYBIT_DEMO: "true"
  MAINNET: "false"
  REAL_MONEY: "false"
  EXCHANGE_WRITE: "false"
  CONTROL_PLANE_READ_ONLY: "true"

jobs:
  control-plane-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flask
      - run: python -m pytest tests/test_unified_nexus_control_plane.py -q --tb=line
      - run: python -m compileall -q backend/nexus_control_plane tools/analysis

  control-plane-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flask pytest
      - name: Security + ownership contracts
        run: |
          python - <<'PY'
          from backend.nexus_control_plane.ownership_contract import validate_execution_ownership
          from backend.nexus_control_plane.federation_client import FederationClient, redact_secrets
          from backend.nexus_control_plane.service_registry import ServiceRegistry
          from backend.nexus_control_plane import federation_counters as c
          c.reset_counters()
          own = validate_execution_ownership()
          assert own["execution_owner_count"] == 1
          assert own["ok"] is True
          assert own["stage3"]["exchange_write"] is False
          assert redact_secrets({"api_secret": "x"})["api_secret"] == "[REDACTED]"
          client = FederationClient(ServiceRegistry.from_env())
          try:
              client._assert_url_allowed("https://evil.example/x")
              raise SystemExit("ssrf_not_blocked")
          except Exception as e:
              assert "SECURITY_BLOCKED" in str(e)
          print("security_ok", own["deploy_gate"])
          PY

  control-plane-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flask pytest
      - name: Schema + no synthetic fallback contract
        run: |
          python - <<'PY'
          from backend.nexus_control_plane.field_envelope import missing
          from backend.nexus_control_plane.aggregator import ControlPlaneAggregator
          from backend.nexus_control_plane.service_registry import ServiceRegistry
          from backend.nexus_control_plane import ROLE_DEMO_EXECUTION, ROLE_MARKET_INTELLIGENCE, DATA_STATUS_SERVICE_UNAVAILABLE, DATA_STATUS_LIVE
          m = missing(ROLE_DEMO_EXECUTION)
          assert m["value"] is None and m["value"] != 0
          class Fake:
              def get_json(self, role, path):
                  if role == ROLE_MARKET_INTELLIGENCE:
                      return {"ok": True, "payload": {"status": "OK"}, "fetched_at": 1.0, "data_status": DATA_STATUS_LIVE}
                  return {"ok": False, "data_status": DATA_STATUS_SERVICE_UNAVAILABLE, "payload": None}
          ov = ControlPlaneAggregator(ServiceRegistry.from_env(), Fake()).overview()
          assert ov["demo_account"]["equity"]["value"] is None
          assert ov["version_labels"]["pr6_branch_head"]["value"] != ov["version_labels"]["observation_deployed_code_sha"]["value"]
          print("contract_ok")
          PY

  control-plane-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  control-plane-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test e2e/control-plane.spec.ts --project=chromium

  control-plane-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test e2e/control-plane.spec.ts --grep @a11y --project=chromium

  control-plane-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flask
      - run: python tools/ci/control_plane_docker_smoke.py
