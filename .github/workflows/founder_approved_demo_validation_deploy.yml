name: founder-approved-demo-validation-deploy

# PHASE A: FAIL-CLOSED / STALE DEPLOY PATH
#
# Historical workflow checked out feature/bybit-demo-execution-validation and
# assembled an ad-hoc context. That is no longer allowed.
#
# Source-of-truth: GitHub main
# Packaging: deploy/zeabur_bybit_demo_validation/
# Deploy: Founder-gated Validation workflow that checks out main
#   (e.g. demo_autonomous_6h_v2_zeabur.yml with explicit inputs —
#    still requires live service-id confirmation before use).
#
# This workflow remains for audit visibility but will not deploy.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "This workflow is DISABLED. Type ACK_STALE_DEMO_VALIDATION_DEPLOY_DISABLED"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-demo-validation-deploy
  cancel-in-progress: false

env:
  SERVICE_NAME: nexus-bybit-demo-learning-validation
  FORBIDDEN_SERVICE_ID: 6a3b81652fdef84a45a2a553

jobs:
  refuse-stale-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "FOUNDER_APPROVED_DEMO_VALIDATION_DEPLOY_STALE=true"
          echo "Required confirm for acknowledgement only: ACK_STALE_DEMO_VALIDATION_DEPLOY_DISABLED"
          if [ "${{ github.event.inputs.confirm }}" != "ACK_STALE_DEMO_VALIDATION_DEPLOY_DISABLED" ]; then
            echo "Confirmation mismatch (deploy remains disabled either way)."
          fi
          echo "Do not use feature/bybit-demo-execution-validation."
          echo "Checkout main + deploy/zeabur_bybit_demo_validation/ instead."
          echo "See deploy/README.md and docs/validation/SERVICE_ID_MAP.md"
          echo "STOP: no Zeabur deploy performed."
          exit 1
