name: founder-approved-demo-validation-deploy

# Founder-approved deploy for independent Bybit Demo validation service.
# Does NOT overwrite Stage3 live service (6a3b81652fdef84a45a2a553).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_DEMO_VALIDATION to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-demo-validation-deploy
  cancel-in-progress: false

env:
  SERVICE_NAME: nexus-bybit-demo-learning-validation
  FORBIDDEN_SERVICE_ID: 6a3b81652fdef84a45a2a553

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY_DEMO_VALIDATION" ]; then
            echo "Confirmation mismatch. Expected DEPLOY_DEMO_VALIDATION"
            exit 1
          fi

  test-gate-runner:
    needs: validate-input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bybit-demo-execution-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Offline gate runner
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/ci/demo_validation_gate_runner.py
      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_bybit_demo_execution_validation.py -q --tb=line
      - name: Upload offline evidence
        uses: actions/upload-artifact@v4
        with:
          name: demo-validation-offline-evidence
          path: artifacts/demo_validation/
          if-no-files-found: warn

  deploy:
    needs: [validate-input, test-gate-runner]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: feature/bybit-demo-execution-validation

      - name: Record deploy meta
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Zeabur CLI (latest — needs project-id flags)
        run: npm i -g zeabur@latest

      - name: Resolve or create validation service
        id: resolve
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          PRESET_SERVICE_ID: ${{ secrets.ZEABUR_DEMO_VALIDATION_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ZEABUR_TOKEN:-}" ] || [ -z "${ZEABUR_PROJECT_ID:-}" ]; then
            echo "Missing ZEABUR_TOKEN or ZEABUR_PROJECT_ID"
            exit 1
          fi
          export ZEABUR_TOKEN
          zeabur context set project --id "$ZEABUR_PROJECT_ID" -y -i=false || true
          SID="${PRESET_SERVICE_ID:-}"
          if [ "$SID" = "$FORBIDDEN_SERVICE_ID" ]; then
            echo "BLOCKED: must not overwrite Stage3 live service"
            exit 1
          fi
          if [ -z "$SID" ]; then
            echo "Creating independent service $SERVICE_NAME"
            set +e
            CREATE_OUT=$(zeabur deploy --create --name "$SERVICE_NAME" --project-id "$ZEABUR_PROJECT_ID" -i=false --json 2>&1)
            CREATE_CODE=$?
            set -e
            echo "create_exit=$CREATE_CODE"
            printf '%s\n' "$CREATE_OUT" > /tmp/create_out.txt
            # Extract candidate ids BEFORE log redaction
            SID=$(python tools/ci/resolve_demo_validation_service_id.py < /tmp/create_out.txt || true)
            if [ -z "$SID" ]; then
              set +e
              LIST_OUT=$(zeabur service list --project-id "$ZEABUR_PROJECT_ID" --json -i=false 2>&1)
              set -e
              printf '%s\n' "$LIST_OUT" > /tmp/list_out.txt
              SID=$(python tools/ci/resolve_demo_validation_service_id.py < /tmp/list_out.txt || true)
            fi
            # Safe log (redact long tokens only; keep 24-char ids)
            sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' /tmp/create_out.txt | tail -n 40
          fi
          if [ -z "$SID" ] || [ "$SID" = "$FORBIDDEN_SERVICE_ID" ]; then
            echo "BLOCKER: could not resolve independent service id"
            exit 1
          fi
          echo "service_id=$SID" >> "$GITHUB_OUTPUT"
          echo "resolved_service_id_prefix=${SID:0:6}"

      - name: Apply env vars and deploy code
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
        run: |
          set -euo pipefail
          export ZEABUR_TOKEN
          if [ "$SERVICE_ID" = "$FORBIDDEN_SERVICE_ID" ]; then
            echo "BLOCKED Stage3 id"
            exit 1
          fi
          zeabur context set project --id "$ZEABUR_PROJECT_ID" -y -i=false || true
          zeabur context set service --id "$SERVICE_ID" -y -i=false || true

          set_var() {
            local k="$1" v="$2"
            set +e
            zeabur variable create --id "$SERVICE_ID" -k "${k}=${v}" -y -i=false >/tmp/var_out.txt 2>&1
            code=$?
            if [ "$code" != "0" ]; then
              zeabur variable update --id "$SERVICE_ID" -k "${k}=${v}" -y -i=false >/tmp/var_out.txt 2>&1
              code=$?
            fi
            set -e
            echo "var_${k}_exit=$code"
          }

          set_var BYBIT_DEMO true
          set_var MAINNET false
          set_var REAL_MONEY false
          set_var LIVE_PRODUCTION false
          set_var DEMO_AUTONOMOUS_ENABLED false
          set_var AUTONOMOUS_SEND false
          set_var NEXUS_AUTONOMOUS_DEMO_AUTO_SEND false
          set_var EXCHANGE_WRITE false
          set_var EXCHANGE_WRITE_ALLOWED false
          set_var NEXUS_EXCHANGE_WRITE_ALLOWED false
          set_var NEXUS_ZEABUR_CLEAN_OBSERVER false
          set_var ARM false
          set_var FIXED_LEVERAGE 25
          set_var AI_CAN_CHANGE_LEVERAGE false
          set_var BYBIT_DEMO_LEARNING_MODE true
          set_var NEXUS_DATA_DIR /data/nexus_demo_validation

          if [ -n "${BYBIT_DEMO_API_KEY:-}" ]; then
            set_var BYBIT_DEMO_API_KEY "$BYBIT_DEMO_API_KEY"
            echo "demo_key_present=true"
          else
            echo "demo_key_present=false"
          fi
          if [ -n "${BYBIT_DEMO_API_SECRET:-}" ]; then
            set_var BYBIT_DEMO_API_SECRET "$BYBIT_DEMO_API_SECRET"
            echo "demo_secret_present=true"
          else
            echo "demo_secret_present=false"
          fi

          zeabur deploy --project-id "$ZEABUR_PROJECT_ID" --service-id "$SERVICE_ID" -i=false

      - name: Create temporary domain if missing
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          export ZEABUR_TOKEN
          zeabur context set service --id "$SERVICE_ID" -y -i=false || true
          set +e
          DOM_OUT=$(zeabur domain list --json -i=false 2>&1)
          set -e
          echo "$DOM_OUT" | sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' | tail -n 20
          if ! echo "$DOM_OUT" | grep -qi "nexus-bybit-demo-learning-validation\|zeabur.app"; then
            set +e
            zeabur domain create --service-id "$SERVICE_ID" -i=false --json 2>&1 | sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' | tail -n 30
            set -e
          fi

      - name: Post-deploy HTTP smoke (optional URL secret)
        env:
          DEPLOY_URL: ${{ secrets.ZEABUR_DEMO_VALIDATION_URL }}
        run: |
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "ZEABUR_DEMO_VALIDATION_URL unset — bind domain in Zeabur then set secret for next run"
            echo "service_id_prefix=${{ steps.resolve.outputs.service_id }}"
            exit 0
          fi
          ok=0
          for i in $(seq 1 36); do
            if curl -fsS "$DEPLOY_URL/health" >/tmp/health.json; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
          curl -fsS "$DEPLOY_URL/api/nexus/demo-execution/status" >/tmp/demo_status.json || true
          python - <<'PY'
          import json
          print("health_ok", bool(json.load(open("/tmp/health.json"))))
          try:
            s=json.load(open("/tmp/demo_status.json"))
            print("gate", s.get("current_stage") or s.get("gate"))
            print("first_demo_smoke_order_ready", s.get("first_demo_smoke_order_ready"))
          except Exception as e:
            print("status_note", type(e).__name__)
          PY
