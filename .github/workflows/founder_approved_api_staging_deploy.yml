# Founder-approved nexus-api-staging deploy (API-only; no runtime/autonomy).
# Does NOT redeploy member-preview, Stage3, or Demo Validation services.

name: founder-approved-api-staging-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_NEXUS_API_STAGING"
        required: true
        type: string
      mode:
        description: "Deployment mode"
        required: true
        type: choice
        default: SAFE_CATCHUP_ONLY
        options:
          - SAFE_CATCHUP_ONLY
          - LEGACY_FULL_DEPLOY
      target_sha:
        description: "Exact 40-character Founder-approved source SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-api-staging-deploy
  cancel-in-progress: false

env:
  SERVICE_NAME: nexus-api-staging
  API_STAGING_SERVICE_ID: 6a7ee0a82b4272705cd1c9c8
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf
  CANONICAL_API_URL: https://nexus-api-staging.zeabur.app
  # Canonical Personal staging browser origin the deployed API must allow (CORS).
  # The retired Member Preview origin is NOT used for verification.
  PERSONAL_STAGING_ORIGIN: https://nexus-personal-staging.zeabur.app
  MEMBER_PREVIEW_SERVICE_ID: 6a744ba3472e2c91a9e728a8
  FORBIDDEN_MEMBER_PREVIEW: 69d559cb2696d526abde8cda
  FORBIDDEN_MEMBER_PREVIEW_STATIC: member-preview-static
  FORBIDDEN_STAGE3: 6a3b81652fdef84a45a2a553
  FORBIDDEN_VALIDATION: 6a82a79aa21454a2cf6b0015
  FORBIDDEN_OLD_VALIDATION: old-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
      target_sha: ${{ steps.guard.outputs.target_sha }}
      origin_main_sha: ${{ steps.guard.outputs.origin_main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha }}
          fetch-depth: 0

      - name: Validate Founder dispatch contract and exact SHA
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY_NEXUS_API_STAGING" ]; then
            echo "Confirmation mismatch"
            exit 1
          fi
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" != "SAFE_CATCHUP_ONLY" ] && [ "$MODE" != "LEGACY_FULL_DEPLOY" ]; then
            echo "Unsupported deployment mode"
            exit 1
          fi
          TARGET_SHA="${{ github.event.inputs.target_sha }}"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character hexadecimal commit SHA"
            exit 1
          fi
          TARGET_SHA="$(printf '%s' "$TARGET_SHA" | tr 'A-F' 'a-f')"
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e "$TARGET_SHA^{commit}"
          ORIGIN_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TARGET_SHA" != "$ORIGIN_MAIN_SHA" ]; then
            echo "BLOCKER: target_sha must match current origin/main for catch-up deployment"
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_HEAD" != "$TARGET_SHA" ]; then
            echo "BLOCKER: checked-out HEAD does not match target_sha"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "origin_main_sha=$ORIGIN_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ORIGIN_MAIN_SHA=$ORIGIN_MAIN_SHA"
          echo "TARGET_SHA_MATCHES_CHECKED_OUT_HEAD=yes"
          echo "TARGET_SHA_MUST_MATCH_CURRENT_MAIN=yes"

  tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
      - name: Verify test checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.target_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flask pytest
      - run: python -m pytest tests/test_v18_3_4_product_http_api.py tests/test_api_staging_safe_catchup_workflow.py -q --tb=line
        env:
          PYTHONPATH: ${{ github.workspace }}
          NEXUS_RUNTIME_BINDING: UNAVAILABLE

  deploy:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify deploy checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.target_sha }}"
          echo "DEPLOY_TARGET_SHA=${{ needs.validate.outputs.target_sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g zeabur@latest

      - name: Resolve API staging service
        id: svc
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          PRESET_SERVICE_ID: ${{ secrets.ZEABUR_API_STAGING_SERVICE_ID }}
        run: |
          set -euo pipefail
          MODE="${{ needs.validate.outputs.mode }}"
          if [ "$MODE" = "SAFE_CATCHUP_ONLY" ]; then
            test -n "$ZEABUR_TOKEN"
            test -n "$ZEABUR_PROJECT_ID"
            zeabur auth login --token "$ZEABUR_TOKEN" -i=false
            SID="$API_STAGING_SERVICE_ID"
            zeabur service get --id "$SID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/api-staging-service.json
            python - <<'PY'
          import json
          from pathlib import Path

          expected_id = "6a7ee0a82b4272705cd1c9c8"
          expected_name = "nexus-api-staging"
          raw = json.loads(Path("/tmp/api-staging-service.json").read_text(encoding="utf-8"))
          ids = set()
          names = set()

          def walk(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key.lower() in {"id", "serviceid", "service_id"} and isinstance(value, str):
                          ids.add(value)
                      if key.lower() in {"name", "servicename", "service_name"} and isinstance(value, str):
                          names.add(value)
                      walk(value)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)

          walk(raw)
          if expected_id not in ids:
              raise SystemExit("BLOCKER: exact API staging service id not confirmed")
          if expected_name not in names:
              raise SystemExit("BLOCKER: exact API staging service name not confirmed")
          forbidden_names = {
              "nexus-member-preview-v18-2-1",
              "member-preview-static",
              "nexus-bybit-demo-learning-validation",
              "stage3",
              "old-validation",
          }
          if names & forbidden_names:
              raise SystemExit("BLOCKER: forbidden service appeared in service metadata")
          print("EXACT_SERVICE_ID_GUARD=yes")
          print("SAFE_CATCHUP_CAN_CREATE_SERVICE=no")
          PY
          else
            SID=$(python tools/ci/ensure_api_staging_zeabur_service.py)
          fi
          if [ -z "$SID" ] || [ "$SID" = "$FORBIDDEN_MEMBER_PREVIEW" ] || [ "$SID" = "$FORBIDDEN_STAGE3" ] || [ "$SID" = "$FORBIDDEN_VALIDATION" ]; then
            echo "BLOCKER: forbidden or unresolved service id"
            exit 1
          fi
          if [ "$SID" != "$API_STAGING_SERVICE_ID" ]; then
            echo "BLOCKER: service id does not match nexus-api-staging"
            exit 1
          fi
          echo "service_id=$SID" >> "$GITHUB_OUTPUT"
          echo "resolved_prefix=${SID:0:6}"

      - name: Safe catch-up read-only environment guard
        if: needs.validate.outputs.mode == 'SAFE_CATCHUP_ONLY'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/staging-vars-readonly.json
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("/tmp/staging-vars-readonly.json").read_text(encoding="utf-8"))
          values = {}

          def walk(node):
              if isinstance(node, dict):
                  key = node.get("key") or node.get("name")
                  value = node.get("value")
                  if isinstance(key, str):
                      values[key] = value if isinstance(value, str) else ""
                  for item in node.values():
                      walk(item)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)

          walk(raw)
          expected = {
              "NEXUS_ENV": "STAGING",
              "NEXUS_STAGING_SESSION_BOOTSTRAP": "false",
              "NEXUS_STAGING_MEMBER_AUTH_ENABLED": "true",
              "NEXUS_STAGING_REGISTRATION_ENABLED": "true",
              "EXCHANGE_WRITE": "false",
              "MAINNET": "false",
              "REAL_MONEY": "false",
              "NEXUS_MEMBER_EXECUTION": "false",
              "NEXUS_RUNTIME_BINDING": "UNAVAILABLE",
              "NEXUS_PG_RUNTIME_ENABLED": "true",
          }
          for key, expected_value in expected.items():
              actual = str(values.get(key, "")).strip()
              if actual != expected_value:
                  raise SystemExit(f"required_safe_variable_mismatch:{key}")
          cors = str(values.get("NEXUS_CORS_ALLOWED_ORIGINS", "")).strip()
          if not cors:
              raise SystemExit("required_variable_missing:NEXUS_CORS_ALLOWED_ORIGINS")
          if any(not part.strip().startswith("https://") for part in cors.split(",") if part.strip()):
              raise SystemExit("required_variable_incompatible:NEXUS_CORS_ALLOWED_ORIGINS")
          database_url_present = bool(str(values.get("DATABASE_URL", "")).strip())
          nexus_postgres_url_present = bool(str(values.get("NEXUS_POSTGRES_URL", "")).strip())
          if not (database_url_present or nexus_postgres_url_present):
              raise SystemExit("required_database_variable_missing:DATABASE_URL_or_NEXUS_POSTGRES_URL")
          print("ENV_MUTATION_IN_SAFE_CATCHUP=no")
          print("SAFE_CATCHUP_ENV_COMPATIBLE=yes")
          print("DATABASE_CREDENTIAL_VARIABLE_PRESENT=yes")
          print("DB_ENV_REQUIREMENT_SEMANTICS=NEXUS_POSTGRES_URL_or_DATABASE_URL")
          PY

      - name: Set and verify required staging API variables
        if: needs.validate.outputs.mode != 'SAFE_CATCHUP_ONLY'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
          NEXUS_STAGING_SEED_EMAIL: ${{ secrets.NEXUS_STAGING_SEED_EMAIL }}
          NEXUS_STAGING_SEED_PASSWORD: ${{ secrets.NEXUS_STAGING_SEED_PASSWORD }}
          NEXUS_FOUNDER_EMAIL: ${{ secrets.NEXUS_FOUNDER_EMAIL }}
          NEXUS_FOUNDER_REGISTRATION_CODE: ${{ secrets.NEXUS_FOUNDER_REGISTRATION_CODE }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "$NEXUS_STAGING_SEED_EMAIL"
          test -n "$NEXUS_STAGING_SEED_PASSWORD"
          test -n "$NEXUS_FOUNDER_EMAIL"
          test -n "$NEXUS_FOUNDER_REGISTRATION_CODE"
          MEMBER_ORIGIN="https://nexus-member-preview-v18-2-1.zeabur.app"
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/staging-vars.json
          python - <<'PY' > /tmp/existing-var-names.txt
          import json
          raw=json.load(open("/tmp/staging-vars.json", encoding="utf-8"))
          names=set()
          def walk(node):
              if isinstance(node, dict):
                  for field in ("key", "name"):
                      value=node.get(field)
                      if isinstance(value, str):
                          names.add(value)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(raw)
          print("\n".join(sorted(names)))
          PY
          set_required_variable() {
            KEY="$1"
            VALUE="$2"
            if grep -Fxq "$KEY" /tmp/existing-var-names.txt; then
              zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$KEY=$VALUE" -y -i=false
            else
              zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$KEY=$VALUE" -y -i=false
            fi
          }
          set_required_variable NEXUS_ENV STAGING
          # Founder registration is canonical; deploys must not revive the
          # retired seed bootstrap path.
          set_required_variable NEXUS_STAGING_SESSION_BOOTSTRAP false
          set_required_variable NEXUS_STAGING_MEMBER_AUTH_ENABLED true
          set_required_variable NEXUS_STAGING_REGISTRATION_ENABLED true
          set_required_variable NEXUS_STAGING_SEED_EMAIL "$NEXUS_STAGING_SEED_EMAIL"
          set_required_variable NEXUS_STAGING_SEED_PASSWORD "$NEXUS_STAGING_SEED_PASSWORD"
          set_required_variable NEXUS_FOUNDER_EMAIL "$NEXUS_FOUNDER_EMAIL"
          set_required_variable NEXUS_FOUNDER_REGISTRATION_CODE "$NEXUS_FOUNDER_REGISTRATION_CODE"
          set_required_variable NEXUS_CORS_ALLOWED_ORIGINS "$MEMBER_ORIGIN"
          set_required_variable EXCHANGE_WRITE false
          set_required_variable MAINNET false
          set_required_variable REAL_MONEY false
          set_required_variable NEXUS_MEMBER_EXECUTION false
          set_required_variable NEXUS_PRODUCTION_BILLING false
          set_required_variable NEXUS_WEB_ONLY true
          set_required_variable NEXUS_EMBEDDED_WORKER false
          set_required_variable NEXUS_ZEABUR_AUTONOMY_DEPLOYED false
          set_required_variable NEXUS_RUNTIME_BINDING UNAVAILABLE
          set_required_variable NEXUS_PG_RUNTIME_ENABLED true
          set_required_variable NEXUS_PG_EVIDENCE_MIRROR_ENABLED false
          # Do not change DATABASE_URL or NEXUS_POSTGRES_URL credentials.
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/staging-vars-verified.json
          NEXUS_STAGING_SEED_EMAIL="$NEXUS_STAGING_SEED_EMAIL" \
          NEXUS_STAGING_SEED_PASSWORD="$NEXUS_STAGING_SEED_PASSWORD" \
          python - <<'PY'
          import json, os
          raw=json.load(open("/tmp/staging-vars-verified.json", encoding="utf-8"))
          values={}
          def walk(node):
              if isinstance(node, dict):
                  key=node.get("key") or node.get("name")
                  value=node.get("value")
                  if isinstance(key, str) and isinstance(value, str):
                      values[key]=value
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(raw)
          expected={
              "NEXUS_ENV": "STAGING",
              "NEXUS_STAGING_SESSION_BOOTSTRAP": "false",
              "NEXUS_STAGING_MEMBER_AUTH_ENABLED": "true",
              "NEXUS_STAGING_REGISTRATION_ENABLED": "true",
              "EXCHANGE_WRITE": "false",
              "MAINNET": "false",
              "REAL_MONEY": "false",
              "NEXUS_MEMBER_EXECUTION": "false",
              "NEXUS_RUNTIME_BINDING": "UNAVAILABLE",
          }
          for key, value in expected.items():
              assert values.get(key) == value, f"required_variable_mismatch:{key}"
          assert values.get("NEXUS_STAGING_SEED_EMAIL") == os.environ["NEXUS_STAGING_SEED_EMAIL"]
          assert values.get("NEXUS_STAGING_SEED_PASSWORD") == os.environ["NEXUS_STAGING_SEED_PASSWORD"]
          assert values.get("NEXUS_FOUNDER_EMAIL") == os.environ["NEXUS_FOUNDER_EMAIL"]
          assert values.get("NEXUS_FOUNDER_REGISTRATION_CODE") == os.environ["NEXUS_FOUNDER_REGISTRATION_CODE"]
          print("NEXUS_ENV=STAGING")
          print("NEXUS_STAGING_SESSION_BOOTSTRAP=false")
          print("NEXUS_STAGING_SEED_EMAIL=CONFIGURED")
          print("NEXUS_STAGING_SEED_PASSWORD=CONFIGURED")
          print("NEXUS_FOUNDER_EMAIL=CONFIGURED")
          print("NEXUS_FOUNDER_REGISTRATION_CODE=CONFIGURED")
          print("STAGING_SEEDED_SESSION_BOUNDARY_PASS")
          PY

      - name: Build slim API-only deploy context
        run: |
          set -euo pipefail
          CTX=/tmp/api_staging_ctx
          rm -rf "$CTX" && mkdir -p "$CTX"
          # api_staging_app.py is the API-only entrypoint; do not ship unified app.py.
          cp api_staging_app.py gunicorn.conf.py requirements.txt "$CTX/"
          cp -r backend config static templates "$CTX/"
          mkdir -p "$CTX/deploy/zeabur_api_staging"
          cp deploy/zeabur_api_staging/Dockerfile "$CTX/Dockerfile"
          cp deploy/zeabur_api_staging/start.sh "$CTX/deploy/zeabur_api_staging/start.sh"
          chmod +x "$CTX/deploy/zeabur_api_staging/start.sh"
          echo "ctx_files=$(find "$CTX" | wc -l)"

      - name: Capture previous deployment metadata
        id: previous_deployment
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur deployment list --service-id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/pre-deployments.json 2>&1 || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          raw = Path("/tmp/pre-deployments.json").read_text(encoding="utf-8", errors="replace")
          deployment_id = ""
          try:
              parsed = json.loads(raw)
          except Exception:
              parsed = None

          def walk(node):
              if isinstance(node, dict):
                  candidate = node.get("id") or node.get("deploymentID") or node.get("deploymentId")
                  if isinstance(candidate, str) and candidate:
                      return candidate
                  for item in node.values():
                      found = walk(item)
                      if found:
                          return found
              elif isinstance(node, list):
                  for item in node:
                      found = walk(item)
                      if found:
                          return found
              return ""

          if parsed is not None:
              deployment_id = walk(parsed)
          print(f"previous_deployment_id={deployment_id}")
          PY
          echo "ROLLBACK_PREVIOUS_DEPLOYMENT_ID_CAPTURED=yes"

      - name: Deploy API staging only
        id: deploy_api
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          (
            cd /tmp/api_staging_ctx
            zeabur deploy --project-id "$ZEABUR_PROJECT_ID" --service-id "$SERVICE_ID" --environment-id "$ZEABUR_ENV_ID" -i=false --json
          ) > /tmp/deploy_out.txt 2>&1
          sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' /tmp/deploy_out.txt | tail -n 60
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          raw = Path("/tmp/deploy_out.txt").read_text(encoding="utf-8", errors="replace")
          deployment_id = ""
          try:
              parsed = json.loads(raw)
          except Exception:
              parsed = None

          def walk(node):
              if isinstance(node, dict):
                  candidate = node.get("id") or node.get("deploymentID") or node.get("deploymentId")
                  if isinstance(candidate, str) and candidate:
                      return candidate
                  for item in node.values():
                      found = walk(item)
                      if found:
                          return found
              elif isinstance(node, list):
                  for item in node:
                      found = walk(item)
                      if found:
                          return found
              return ""

          if parsed is not None:
              deployment_id = walk(parsed)
          print(f"new_deployment_id={deployment_id}")
          PY
          echo "TARGET_SHA=${{ needs.validate.outputs.target_sha }}"
          echo "EXPLICIT_SERVICE_RESTART_IN_SAFE_CATCHUP=no"
          sleep 50

      - name: Legacy explicit service restart
        if: needs.validate.outputs.mode != 'SAFE_CATCHUP_ONLY'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur service restart --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false || true

      - name: Read-only post-deploy verification
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur domain list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/dom.txt 2> /tmp/dom.err || true
          URL=$(python - <<'PY'
          import re
          raw=open('/tmp/dom.txt',encoding='utf-8',errors='replace').read()
          # Accept a bare Zeabur hostname or a scheme-qualified URL; normalize to https.
          m=re.search(r'([a-z0-9-]+(?:\.[a-z0-9-]+)*\.zeabur\.app)', raw, re.I)
          print('https://' + m.group(1) if m else '')
          PY
          )
          if [ -z "$URL" ]; then
            # Fall back to the canonical API URL (proven by the read-only
            # diagnostic to bind to this exact service/env). Never skip verify.
            URL="$CANONICAL_API_URL"
            echo "DOMAIN_LOOKUP_FELL_BACK_TO_CANONICAL=yes"
          fi
          echo "VERIFY_TARGET_RESOLVED=yes"

          # --- Deployment activation gate (Zeabur activates asynchronously) ------
          # Prove the deploy created a NEW deployment, then poll THAT exact
          # deployment until it reaches a terminal activated state before doing any
          # live HTTP verification. Never blindly sleep-and-assume.
          PREV_DEPLOYMENT_ID="${{ steps.previous_deployment.outputs.previous_deployment_id }}"
          NEW_DEPLOYMENT_ID="${{ steps.deploy_api.outputs.new_deployment_id }}"
          echo "PREVIOUS_DEPLOYMENT_ID=$PREV_DEPLOYMENT_ID"
          echo "NEW_DEPLOYMENT_ID=$NEW_DEPLOYMENT_ID"
          if [ -n "$NEW_DEPLOYMENT_ID" ] && [ -n "$PREV_DEPLOYMENT_ID" ] && [ "$NEW_DEPLOYMENT_ID" = "$PREV_DEPLOYMENT_ID" ]; then
            echo "NEW_DEPLOYMENT_ID_DID_NOT_ADVANCE=yes"
            echo "POST_DEPLOY_VERIFY_FAIL_CLOSED=yes"
            exit 1
          fi

          # A durable Workstream-B activation marker: the new-code route /personal/catalog
          # returns 200 only once the new deployment is serving (older deployments 404).
          activated=no
          dep_status=UNKNOWN
          catalog_http=000
          for attempt in $(seq 1 40); do
            zeabur deployment list --service-id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/dep-poll.json 2>&1 || true
            dep_status="$(python tools/ci/zeabur_deployment_status.py /tmp/dep-poll.json "$NEW_DEPLOYMENT_ID")"
            catalog_http="$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$URL/api/v1/personal/catalog" || echo 000)"
            echo "activation_attempt=$attempt deployment_status=$dep_status catalog_http=$catalog_http"
            if [ "$dep_status" = "FAILED" ]; then
              echo "NEW_DEPLOYMENT_FAILED=yes"
              echo "POST_DEPLOY_VERIFY_FAIL_CLOSED=yes"
              exit 1
            fi
            if [ "$catalog_http" = "200" ] || [ "$dep_status" = "RUNNING" ]; then
              activated=yes
              break
            fi
            sleep 15
          done
          if [ "$activated" != "yes" ]; then
            echo "DEPLOYMENT_ACTIVATION_TIMEOUT=yes deployment_status=$dep_status catalog_http=$catalog_http"
            echo "LIVE_VERIFICATION_TIMEOUT=yes"
            echo "POST_DEPLOY_VERIFY_FAIL_CLOSED=yes"
            exit 1
          fi
          echo "NEW_DEPLOYMENT_ACTIVATED=yes"

          # --- Live HTTP verification (only after activation) --------------------
          # Fail closed on timeout so success always means an actual verifier PASS.
          ok=no
          for attempt in $(seq 1 40); do
            if PERSONAL_STAGING_ORIGIN="$PERSONAL_STAGING_ORIGIN" python tools/ci/verify_api_staging_deployment.py "$URL"; then
              ok=yes
              break
            fi
            echo "live_markers_not_ready_attempt=$attempt"
            sleep 15
          done
          if [ "$ok" != "yes" ]; then
            echo "LIVE_VERIFICATION_TIMEOUT=yes"
            echo "POST_DEPLOY_VERIFY_FAIL_CLOSED=yes"
            exit 1
          fi
          echo "READ_ONLY_POST_DEPLOY_VERIFY=yes"
          echo "CORS_CSRF_MARKER_VERIFIED_BY_WORKFLOW=yes"
          echo "AUTH_FOUNDATION_MARKER_VERIFIED_BY_WORKFLOW=yes"
          echo "PERSONAL_ORIGIN_CORS_VERIFIED_BY_WORKFLOW=yes"
          echo "WORKSTREAM_B_ROUTES_VERIFIED_BY_WORKFLOW=yes"
          echo "POST_DEPLOY_VERIFY_FAIL_CLOSED=yes"

      - name: Capture new deployment metadata
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur deployment list --service-id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/post-deployments.json 2>&1 || true
          echo "ROLLBACK_METADATA_CAPTURED=yes"
          echo "TARGET_SHA=${{ needs.validate.outputs.target_sha }}"
          echo "PREVIOUS_DEPLOYMENT_ID=${{ steps.previous_deployment.outputs.previous_deployment_id }}"
          echo "NEW_DEPLOYMENT_ID=${{ steps.deploy_api.outputs.new_deployment_id }}"

      - name: Private Postgres staging E2E (in-pod, auto-cleanup)
        if: needs.validate.outputs.mode != 'SAFE_CATCHUP_ONLY'
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          # Never dumps DATABASE_URL / session IDs; prints boolean checks only.
          set +e
          OUT=$(zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            python -m backend.nexus_product_backend.staging_e2e 2>&1)
          set -e
          printf '%s\n' "$OUT" | sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' | tail -n 40
          OUT="$OUT" python - <<'PY'
          import json,os
          lines=[line.strip() for line in os.environ.get("OUT","").splitlines() if line.strip()]
          if not lines:
              print("staging_e2e_skipped_empty_exec_output")
              raise SystemExit(0)
          payload=None
          for line in reversed(lines):
              try:
                  payload=json.loads(line)
                  break
              except Exception:
                  continue
          if not isinstance(payload, dict):
              print("staging_e2e_skipped_unparseable_exec_output")
              raise SystemExit(0)
          assert payload.get("ok") is True and payload.get("cleanup")=="completed", payload
          print("staging_e2e_ok")
          PY
