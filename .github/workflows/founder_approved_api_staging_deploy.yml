# Founder-approved nexus-api-staging deploy (API-only; no runtime/autonomy).
# Does NOT redeploy member-preview, Stage3, or Demo Validation services.

name: founder-approved-api-staging-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_NEXUS_API_STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-api-staging-deploy
  cancel-in-progress: false

env:
  SERVICE_NAME: nexus-api-staging
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf
  MEMBER_PREVIEW_SERVICE_ID: 6a744ba3472e2c91a9e728a8
  FORBIDDEN_MEMBER_PREVIEW: 69d559cb2696d526abde8cda
  FORBIDDEN_STAGE3: 6a3b81652fdef84a45a2a553
  FORBIDDEN_VALIDATION: 6a69ad539949111176cefe63

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY_NEXUS_API_STAGING" ]; then
            echo "Confirmation mismatch"
            exit 1
          fi

  tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flask pytest
      - run: python -m pytest tests/test_v18_3_4_product_http_api.py -q --tb=line
        env:
          PYTHONPATH: ${{ github.workspace }}
          NEXUS_RUNTIME_BINDING: UNAVAILABLE

  deploy:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g zeabur@latest

      - name: Resolve or create API staging service
        id: svc
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          PRESET_SERVICE_ID: ${{ secrets.ZEABUR_API_STAGING_SERVICE_ID }}
        run: |
          set -euo pipefail
          SID=$(python tools/ci/ensure_api_staging_zeabur_service.py)
          if [ -z "$SID" ] || [ "$SID" = "$FORBIDDEN_MEMBER_PREVIEW" ] || [ "$SID" = "$FORBIDDEN_STAGE3" ] || [ "$SID" = "$FORBIDDEN_VALIDATION" ]; then
            echo "BLOCKER: forbidden or unresolved service id"
            exit 1
          fi
          echo "service_id=$SID" >> "$GITHUB_OUTPUT"
          echo "resolved_prefix=${SID:0:6}"

      - name: Set and verify required staging API variables
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
          NEXUS_STAGING_SEED_EMAIL: ${{ secrets.NEXUS_STAGING_SEED_EMAIL }}
          NEXUS_STAGING_SEED_PASSWORD: ${{ secrets.NEXUS_STAGING_SEED_PASSWORD }}
          NEXUS_FOUNDER_EMAIL: ${{ secrets.NEXUS_FOUNDER_EMAIL }}
          NEXUS_FOUNDER_REGISTRATION_CODE: ${{ secrets.NEXUS_FOUNDER_REGISTRATION_CODE }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "$NEXUS_STAGING_SEED_EMAIL"
          test -n "$NEXUS_STAGING_SEED_PASSWORD"
          test -n "$NEXUS_FOUNDER_EMAIL"
          test -n "$NEXUS_FOUNDER_REGISTRATION_CODE"
          MEMBER_ORIGIN="https://nexus-member-preview-v18-2-1.zeabur.app"
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/staging-vars.json
          python - <<'PY' > /tmp/existing-var-names.txt
          import json
          raw=json.load(open("/tmp/staging-vars.json", encoding="utf-8"))
          names=set()
          def walk(node):
              if isinstance(node, dict):
                  for field in ("key", "name"):
                      value=node.get(field)
                      if isinstance(value, str):
                          names.add(value)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(raw)
          print("\n".join(sorted(names)))
          PY
          set_required_variable() {
            KEY="$1"
            VALUE="$2"
            if grep -Fxq "$KEY" /tmp/existing-var-names.txt; then
              zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$KEY=$VALUE" -y -i=false
            else
              zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$KEY=$VALUE" -y -i=false
            fi
          }
          set_required_variable NEXUS_ENV STAGING
          # Founder registration is canonical; deploys must not revive the
          # retired seed bootstrap path.
          set_required_variable NEXUS_STAGING_SESSION_BOOTSTRAP false
          set_required_variable NEXUS_STAGING_MEMBER_AUTH_ENABLED true
          set_required_variable NEXUS_STAGING_REGISTRATION_ENABLED true
          set_required_variable NEXUS_STAGING_SEED_EMAIL "$NEXUS_STAGING_SEED_EMAIL"
          set_required_variable NEXUS_STAGING_SEED_PASSWORD "$NEXUS_STAGING_SEED_PASSWORD"
          set_required_variable NEXUS_FOUNDER_EMAIL "$NEXUS_FOUNDER_EMAIL"
          set_required_variable NEXUS_FOUNDER_REGISTRATION_CODE "$NEXUS_FOUNDER_REGISTRATION_CODE"
          set_required_variable NEXUS_CORS_ALLOWED_ORIGINS "$MEMBER_ORIGIN"
          set_required_variable EXCHANGE_WRITE false
          set_required_variable MAINNET false
          set_required_variable REAL_MONEY false
          set_required_variable NEXUS_MEMBER_EXECUTION false
          set_required_variable NEXUS_PRODUCTION_BILLING false
          set_required_variable NEXUS_WEB_ONLY true
          set_required_variable NEXUS_EMBEDDED_WORKER false
          set_required_variable NEXUS_ZEABUR_AUTONOMY_DEPLOYED false
          set_required_variable NEXUS_RUNTIME_BINDING UNAVAILABLE
          set_required_variable NEXUS_PG_RUNTIME_ENABLED true
          set_required_variable NEXUS_PG_EVIDENCE_MIRROR_ENABLED false
          # Do not change DATABASE_URL or NEXUS_POSTGRES_URL credentials.
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/staging-vars-verified.json
          NEXUS_STAGING_SEED_EMAIL="$NEXUS_STAGING_SEED_EMAIL" \
          NEXUS_STAGING_SEED_PASSWORD="$NEXUS_STAGING_SEED_PASSWORD" \
          python - <<'PY'
          import json, os
          raw=json.load(open("/tmp/staging-vars-verified.json", encoding="utf-8"))
          values={}
          def walk(node):
              if isinstance(node, dict):
                  key=node.get("key") or node.get("name")
                  value=node.get("value")
                  if isinstance(key, str) and isinstance(value, str):
                      values[key]=value
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(raw)
          expected={
              "NEXUS_ENV": "STAGING",
              "NEXUS_STAGING_SESSION_BOOTSTRAP": "false",
              "NEXUS_STAGING_MEMBER_AUTH_ENABLED": "true",
              "NEXUS_STAGING_REGISTRATION_ENABLED": "true",
              "EXCHANGE_WRITE": "false",
              "MAINNET": "false",
              "REAL_MONEY": "false",
              "NEXUS_MEMBER_EXECUTION": "false",
              "NEXUS_RUNTIME_BINDING": "UNAVAILABLE",
          }
          for key, value in expected.items():
              assert values.get(key) == value, f"required_variable_mismatch:{key}"
          assert values.get("NEXUS_STAGING_SEED_EMAIL") == os.environ["NEXUS_STAGING_SEED_EMAIL"]
          assert values.get("NEXUS_STAGING_SEED_PASSWORD") == os.environ["NEXUS_STAGING_SEED_PASSWORD"]
          assert values.get("NEXUS_FOUNDER_EMAIL") == os.environ["NEXUS_FOUNDER_EMAIL"]
          assert values.get("NEXUS_FOUNDER_REGISTRATION_CODE") == os.environ["NEXUS_FOUNDER_REGISTRATION_CODE"]
          print("NEXUS_ENV=STAGING")
          print("NEXUS_STAGING_SESSION_BOOTSTRAP=false")
          print("NEXUS_STAGING_SEED_EMAIL=CONFIGURED")
          print("NEXUS_STAGING_SEED_PASSWORD=CONFIGURED")
          print("NEXUS_FOUNDER_EMAIL=CONFIGURED")
          print("NEXUS_FOUNDER_REGISTRATION_CODE=CONFIGURED")
          print("STAGING_SEEDED_SESSION_BOUNDARY_PASS")
          PY

      - name: Build slim API-only deploy context
        run: |
          set -euo pipefail
          CTX=/tmp/api_staging_ctx
          rm -rf "$CTX" && mkdir -p "$CTX"
          # api_staging_app.py is the API-only entrypoint; do not ship unified app.py.
          cp api_staging_app.py gunicorn.conf.py requirements.txt "$CTX/"
          cp -r backend config static templates "$CTX/"
          mkdir -p "$CTX/deploy/zeabur_api_staging"
          cp deploy/zeabur_api_staging/Dockerfile "$CTX/Dockerfile"
          cp deploy/zeabur_api_staging/start.sh "$CTX/deploy/zeabur_api_staging/start.sh"
          chmod +x "$CTX/deploy/zeabur_api_staging/start.sh"
          echo "ctx_files=$(find "$CTX" | wc -l)"

      - name: Deploy API staging only
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          (
            cd /tmp/api_staging_ctx
            zeabur deploy --project-id "$ZEABUR_PROJECT_ID" --service-id "$SERVICE_ID" -i=false --json
          ) > /tmp/deploy_out.txt 2>&1
          sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' /tmp/deploy_out.txt | tail -n 60
          zeabur service restart --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false || true
          sleep 50

      - name: Verify redacted health/readiness
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur domain list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/dom.txt 2>&1 || true
          URL=$(python - <<'PY'
          import re
          raw=open('/tmp/dom.txt',encoding='utf-8',errors='replace').read()
          m=re.search(r'https://[a-z0-9.-]+\.zeabur\.app', raw)
          print(m.group(0) if m else '')
          PY
          )
          if [ -z "$URL" ]; then
            echo "domain_not_ready_yet"
            exit 0
          fi
          python tools/ci/verify_api_staging_deployment.py "$URL"

      - name: Private Postgres staging E2E (in-pod, auto-cleanup)
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          # Never dumps DATABASE_URL / session IDs; prints boolean checks only.
          set +e
          OUT=$(zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            python -m backend.nexus_product_backend.staging_e2e 2>&1)
          set -e
          printf '%s\n' "$OUT" | sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' | tail -n 40
          OUT="$OUT" python - <<'PY'
          import json,os
          lines=[line.strip() for line in os.environ.get("OUT","").splitlines() if line.strip()]
          if not lines:
              print("staging_e2e_skipped_empty_exec_output")
              raise SystemExit(0)
          payload=None
          for line in reversed(lines):
              try:
                  payload=json.loads(line)
                  break
              except Exception:
                  continue
          if not isinstance(payload, dict):
              print("staging_e2e_skipped_unparseable_exec_output")
              raise SystemExit(0)
          assert payload.get("ok") is True and payload.get("cleanup")=="completed", payload
          print("staging_e2e_ok")
          PY
