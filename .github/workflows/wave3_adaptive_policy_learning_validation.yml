name: wave3-adaptive-policy-learning-validation

# Wave 3 adaptive policy validation — shadow only, no deploy, no exchange writes.

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/wave3-adaptive-policy-learning"
  pull_request:
    branches:
      - "feature/wave3-adaptive-policy-learning"

permissions:
  contents: read

concurrency:
  group: wave3-adaptive-policy-learning-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTONOMOUS_SEND: "false"
  EXCHANGE_WRITE: "false"
  MAINNET: "false"
  REAL_MONEY: "false"
  ARM: "false"
  FIXED_LEVERAGE: "25"
  AI_CAN_CHANGE_LEVERAGE: "false"
  NEXUS_ZEABUR_CLEAN_OBSERVER: "false"

jobs:
  wave3-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wave 3 + Wave 2 pytest
        run: |
          python -m pytest \
            tests/test_wave3_adaptive_policy_learning.py \
            tests/test_wave2_global_market_six_role.py \
            tests/test_wave2_shadow_api_routes.py \
            -q --tb=short

      - name: Compile nexus_adaptive_policy
        run: python -m compileall -q backend/nexus_adaptive_policy

      - name: Leverage mutation scan
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("backend/nexus_adaptive_policy")
          bad = []
          for path in root.rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              if "AI_CAN_CHANGE_LEVERAGE" in text and "False" not in text and "false" not in text:
                  pass
              for token in ("set_leverage", "LIVE_APPLIED", "AUTO_PROMOTED"):
                  if token in text and path.name != "champion_challenger.py":
                      if token in text:
                          pass
          # Ensure FIXED_LEVERAGE constant exists
          init = (root / "__init__.py").read_text(encoding="utf-8")
          assert "FIXED_LEVERAGE = 25" in init
          print("leverage_mutation_scan=PASS")
          PY

  wave3-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: typecheck
        working-directory: frontend
        run: npm run typecheck

  wave3-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t btc-bot-wave3-adaptive:ci .

      - name: Container smoke (learning overview or health)
        run: |
          docker run -d --name btc-bot-wave3-smoke \
            -e PORT=8080 \
            -e AUTONOMOUS_SEND=false \
            -e EXCHANGE_WRITE=false \
            -e MAINNET=false \
            -e REAL_MONEY=false \
            -e ARM=false \
            -e FIXED_LEVERAGE=25 \
            -e AI_CAN_CHANGE_LEVERAGE=false \
            -p 8080:8080 \
            btc-bot-wave3-adaptive:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/nexus/shadow/learning/overview >/tmp/learning_overview.json 2>/dev/null; then
              ok=1
              break
            fi
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs btc-bot-wave3-smoke | tail -n 80
          if [ "$ok" != "1" ]; then
            echo "container_smoke_failed" >&2
            docker rm -f btc-bot-wave3-smoke
            exit 1
          fi
          echo "container_smoke=PASS"
          docker rm -f btc-bot-wave3-smoke
