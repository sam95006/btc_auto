name: wave4-product-ui-intelligence-validation

# Wave 4 product UI intelligence — shadow/UI only, no deploy, no exchange writes.

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/wave4-product-ui-intelligence"
  pull_request:
    branches:
      - "feature/wave3-adaptive-policy-learning"

permissions:
  contents: read

concurrency:
  group: wave4-product-ui-intelligence-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTONOMOUS_SEND: "false"
  EXCHANGE_WRITE: "false"
  MAINNET: "false"
  REAL_MONEY: "false"
  ARM: "false"
  FIXED_LEVERAGE: "25"
  AI_CAN_CHANGE_LEVERAGE: "false"
  EXPLICIT_FIXTURE_MODE: "false"
  NEXUS_ZEABUR_CLEAN_OBSERVER: "false"

jobs:
  wave4-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wave 4 + Wave 3 + Wave 2 pytest
        run: |
          python -m pytest \
            tests/test_wave4_product_ui_intelligence.py \
            tests/test_wave4_visual_acceptance.py \
            tests/test_wave3_adaptive_policy_learning.py \
            tests/test_wave2_global_market_six_role.py \
            tests/test_wave2_shadow_api_routes.py \
            -q --tb=short

      - name: Fixture truth scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          matrix = json.loads(Path("docs/04_readiness/NEXUS_WAVE4_UI_FEATURE_PRESERVATION_MATRIX.json").read_text())
          assert matrix["feature_loss_count"] == 0
          audit = json.loads(Path("docs/04_readiness/NEXUS_WAVE4_DATAHUNTERX_FEATURE_AUDIT.json").read_text())
          assert audit["copy_forbidden"] is True
          app = Path("frontend/src/App.tsx").read_text(encoding="utf-8")
          assert "FloatingAIAssistant" not in app
          assert "AiCommander" in app
          assert 'path="/founder/runtime"' in app
          print("fixture_truth_scan=PASS")
          PY

  wave4-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: build
        working-directory: frontend
        run: npm run build

      - name: Wave4 tokens imported
        run: grep -q wave4ProductTokens.css frontend/src/main.tsx

  wave4-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [wave4-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: build
        working-directory: frontend
        run: npm run build

      - name: Playwright e2e (functional)
        working-directory: frontend
        run: npm run e2e -- --grep-invert "@visual|@a11y"

  wave4-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [wave4-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: build
        working-directory: frontend
        run: npm run build

      - name: Playwright accessibility (@a11y)
        working-directory: frontend
        run: npm run e2e:a11y

  wave4-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [wave4-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: build
        working-directory: frontend
        run: npm run build

      - name: Playwright visual regression (@visual)
        working-directory: frontend
        run: npm run e2e:visual

      - name: Upload Wave4 visual artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave4-visual-screenshots
          path: artifacts/wave4/after/
          if-no-files-found: warn

  wave4-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t btc-bot-wave4-product-ui:ci .

      - name: Container smoke (/overview /universe /founder/runtime)
        run: |
          docker run -d --name btc-bot-wave4-smoke \
            -e PORT=8080 \
            -e AUTONOMOUS_SEND=false \
            -e EXCHANGE_WRITE=false \
            -e MAINNET=false \
            -e REAL_MONEY=false \
            -e ARM=false \
            -e FIXED_LEVERAGE=25 \
            -e AI_CAN_CHANGE_LEVERAGE=false \
            -e EXPLICIT_FIXTURE_MODE=false \
            -e NEXUS_ZEABUR_CLEAN_OBSERVER=false \
            -p 8080:8080 \
            btc-bot-wave4-product-ui:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "health_check_failed" >&2
            docker logs btc-bot-wave4-smoke | tail -n 80
            docker rm -f btc-bot-wave4-smoke
            exit 1
          fi
          for path in /overview /universe /founder/runtime; do
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "http://127.0.0.1:8080${path}")
            echo "smoke_${path//\//_}=${code}"
            if [ "$code" != "200" ]; then
              echo "container_smoke_failed path=${path}" >&2
              docker logs btc-bot-wave4-smoke | tail -n 80
              docker rm -f btc-bot-wave4-smoke
              exit 1
            fi
          done
          echo "container_smoke=PASS"
          docker rm -f btc-bot-wave4-smoke
