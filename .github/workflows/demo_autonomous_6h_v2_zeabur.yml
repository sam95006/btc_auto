name: demo-autonomous-6h-v2-zeabur

# CONDITIONALLY APPROVED. Allows either full 24H observation PASS
# OR explicit Founder abort override (never a silent boolean skip).
# Never creates a new Zeabur service. Deploy target = existing Validation only.
# 12H is NOT auto-started here — machine gate only after 6H finalize.

on:
  workflow_dispatch:
    inputs:
      founder_approval_phrase:
        description: "APPROVE_NEXUS_DEMO_6H_V2 or APPROVE_NEXUS_DEMO_12H_V3_EXTENDED_OBSERVATION"
        required: true
        type: string
      start_12h_after_deploy:
        description: "For 12H extended phrase only: POST bounded-12h/start after T+180"
        required: false
        default: "false"
        type: string
      expected_runtime_sha:
        required: true
        type: string
      expected_service_id:
        required: true
        default: "6a69ad539949111176cefe63"
        type: string
      expected_account_epoch:
        required: false
        default: ""
        type: string
      session_nonce:
        required: true
        type: string
      observation_report_path:
        required: false
        default: "docs/04_readiness/NEXUS_SINGLE_SERVICE_OPERATIONAL_OBSERVATION_ABORTED_REPORT.md"
        type: string
      founder_override_id:
        required: false
        default: "FO-20260801-ABORT24H-DEMO6H12H"
        type: string
      founder_override_abort_operational_24h:
        description: "Must be exact string true when using abort path"
        required: false
        default: "true"
        type: string
      founder_approve_demo_autonomous_6h_v2:
        description: "Must be exact string true"
        required: false
        default: "true"
        type: string
      founder_approve_demo_autonomous_12h_v3:
        description: "Must be exact string true to arm 12H (still machine-gated)"
        required: false
        default: "true"
        type: string
      live_start:
        description: "Set true to POST bounded-6h/start AFTER deploy. false = deploy-only (probe path)."
        required: false
        default: "false"
        type: string
      deploy_validation:
        description: "Set true to redeploy existing Validation service"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

concurrency:
  group: demo-6h-v2-zeabur
  cancel-in-progress: false

env:
  MAINNET: "false"
  REAL_MONEY: "false"
  EXCHANGE_WRITE: "false"
  DEMO_AUTONOMOUS_ENABLED: "false"
  VALIDATION_SERVICE_ID: 6a69ad539949111176cefe63
  FORBIDDEN_STAGE3: 6a3b81652fdef84a45a2a553
  DEMO_VAL_URL: https://nexus-bybit-demo-val.zeabur.app
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf

jobs:
  gate-and-prepare:
    if: ${{ github.event.inputs.founder_approval_phrase == 'APPROVE_NEXUS_DEMO_6H_V2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      allow_live_start: ${{ steps.live.outputs.allow }}
      allow_deploy: ${{ steps.live.outputs.allow_deploy }}
    steps:
      - name: Confirm Founder phrase
        run: |
          if [ "${{ github.event.inputs.founder_approval_phrase }}" != "APPROVE_NEXUS_DEMO_6H_V2" ]; then
            echo "Founder phrase mismatch"
            exit 1
          fi
      - name: Service id must be Validation only
        run: |
          SID="${{ github.event.inputs.expected_service_id }}"
          if [ "$SID" != "$VALIDATION_SERVICE_ID" ]; then echo "wrong service"; exit 1; fi
          if [ "$SID" = "$FORBIDDEN_STAGE3" ]; then echo "stage3 forbidden"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flask pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Unit + override + dry-run gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_demo_6h_v2_readiness.py tests/test_demo_6h_12h_session_engine.py tests/test_founder_operational_override.py tests/test_demo_autonomous_6h_bounded_validation.py -q --tb=line
          python tools/ci/demo_6h_v2_dry_run.py
      - name: Honest observation PASS or Founder abort override
        env:
          PYTHONPATH: ${{ github.workspace }}
          FOUNDER_OVERRIDE_ABORT_OPERATIONAL_24H: ${{ github.event.inputs.founder_override_abort_operational_24h }}
          FOUNDER_APPROVE_DEMO_AUTONOMOUS_6H_V2: ${{ github.event.inputs.founder_approve_demo_autonomous_6h_v2 }}
          FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3: ${{ github.event.inputs.founder_approve_demo_autonomous_12h_v3 }}
          MAINNET: "false"
          REAL_MONEY: "false"
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from backend.nexus_demo_execution.founder_operational_override import (
              build_override_record,
              evaluate_operational_observation_gate,
          )
          cands = [
              Path("""${{ github.event.inputs.observation_report_path }}"""),
              Path("docs/04_readiness/NEXUS_SINGLE_SERVICE_OPERATIONAL_OBSERVATION_ABORTED_REPORT.md"),
              Path("docs/04_readiness/NEXUS_SINGLE_SERVICE_24H_OPERATIONAL_FINAL_REPORT.md"),
              Path("artifacts/single_service_observation/observation_aborted.json"),
              Path("artifacts/single_service_observation/final_pass.json"),
          ]
          path = next((p for p in cands if p.exists()), None)
          if path is None:
              print("observation report missing")
              sys.exit(1)
          text = path.read_text(encoding="utf-8", errors="ignore")
          ov = None
          oid = """${{ github.event.inputs.founder_override_id }}""".strip()
          if oid:
              ov = build_override_record(
                  founder_override_id=oid,
                  approved_at=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  source_observation_report=str(path),
                  source_text=text,
              )
              Path("artifacts").mkdir(exist_ok=True)
              Path("artifacts/founder_override_record.json").write_text(
                  json.dumps(ov.to_dict(), indent=2) + "\n", encoding="utf-8"
              )
              print(json.dumps(ov.to_dict(), indent=2))
          gate = evaluate_operational_observation_gate(observation_text=text, override=ov)
          print(json.dumps({k: gate[k] for k in ("allow_6h_v2_start","path","problems","markers")}, indent=2))
          if not gate["allow_6h_v2_start"]:
              sys.exit(1)
          assert gate["can_bypass_6h_to_12h_machine_gate"] is False
          assert gate["can_enable_mainnet"] is False
          print("observation_gate_ok", gate["path"])
          PY
      - name: Live preflight (GET-only)
        id: live
        env:
          PYTHONPATH: ${{ github.workspace }}
          FOUNDER_OVERRIDE_ABORT_OPERATIONAL_24H: ${{ github.event.inputs.founder_override_abort_operational_24h }}
          FOUNDER_APPROVE_DEMO_AUTONOMOUS_6H_V2: ${{ github.event.inputs.founder_approve_demo_autonomous_6h_v2 }}
          FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3: ${{ github.event.inputs.founder_approve_demo_autonomous_12h_v3 }}
          FOUNDER_OVERRIDE_ID: ${{ github.event.inputs.founder_override_id }}
          FOUNDER_APPROVAL_PHRASE: ${{ github.event.inputs.founder_approval_phrase }}
          FOUNDER_6H_APPROVED: "true"
          MAINNET: "false"
          REAL_MONEY: "false"
        run: |
          python tools/ci/demo_6h_v2_preflight.py --out artifacts/demo_6h_v2_preflight.json --require-ready
          echo "allow_deploy=${{ github.event.inputs.deploy_validation }}" >> "$GITHUB_OUTPUT"
          echo "allow=${{ github.event.inputs.live_start }}" >> "$GITHUB_OUTPUT"
          echo "NEXUS_6H_V2_PREFLIGHT_PASS" >> "$GITHUB_STEP_SUMMARY"

  arm-and-deploy:
    needs: gate-and-prepare
    if: needs.gate-and-prepare.outputs.allow_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g zeabur@latest
      - name: Arm Founder V2 gate env on existing Validation only
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          SID="$VALIDATION_SERVICE_ID"
          ENV_ID="$ZEABUR_ENV_ID"
          if [ "$SID" = "$FORBIDDEN_STAGE3" ]; then echo BLOCKED; exit 1; fi
          set_var() {
            local k="$1" v="$2"
            set +e
            zeabur variable upsert --key "$k" --value "$v" --service-id "$SID" --env-id "$ENV_ID" -i=false >/tmp/var_out.txt 2>&1
            code=$?
            if [ "$code" != "0" ]; then
              zeabur variable create --key "$k" --value "$v" --service-id "$SID" --env-id "$ENV_ID" -i=false >/tmp/var_out.txt 2>&1
              code=$?
            fi
            if [ "$code" != "0" ]; then
              zeabur variable create --id "$SID" -k "${k}=${v}" -y -i=false >/tmp/var_out.txt 2>&1
              code=$?
            fi
            if [ "$code" != "0" ]; then
              zeabur variable update --id "$SID" -k "${k}=${v}" -y -i=false >/tmp/var_out.txt 2>&1
              code=$?
            fi
            set -e
            echo "var_${k}_exit=$code"
            sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' /tmp/var_out.txt | tail -n 3 || true
            if [ "$code" != "0" ]; then echo "FAILED_SET $k"; exit 1; fi
          }
          SHA="${{ github.event.inputs.expected_runtime_sha }}"
          set_var FOUNDER_GATE DEMO_AUTONOMOUS_6H_V2_BOUNDED_VALIDATION
          set_var FOUNDER_6H_APPROVED true
          set_var FOUNDER_OVERRIDE_ABORT_OPERATIONAL_24H true
          set_var FOUNDER_APPROVE_DEMO_AUTONOMOUS_6H_V2 true
          set_var FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3 true
          set_var FOUNDER_OVERRIDE_ID "${{ github.event.inputs.founder_override_id }}"
          set_var SESSION_NONCE "${{ github.event.inputs.session_nonce }}"
          set_var NEW_ENTRY_BLOCKED false
          set_var EXCHANGE_WRITE false
          set_var DEMO_AUTONOMOUS_ENABLED false
          set_var MAINNET false
          set_var REAL_MONEY false
          set_var NEXUS_DEPLOYMENT_ID "$SHA"
          set_var NEXUS_DEPLOY_RUN_ID "$GITHUB_RUN_ID"
          set_var GITHUB_SHA "$SHA"
          set_var NEXUS_BUILD_MARKER "6H_V2_${SHA:0:8}"
      - name: Redeploy Validation with V2 start code (existing service only)
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          cd frontend && npm ci && npm run build && cd ..
          CTX=/tmp/6h_v2_ctx
          rm -rf "$CTX" && mkdir -p "$CTX/tools" "$CTX/deploy/zeabur_bybit_demo_validation"
          cp app.py run.py gunicorn.conf.py zbpack.json requirements.txt "$CTX/"
          cp -r backend config static templates "$CTX/"
          mkdir -p "$CTX/static/operator_ui"
          cp -r frontend/dist/* "$CTX/static/operator_ui/" || true
          cp deploy/zeabur_bybit_demo_validation/Dockerfile "$CTX/Dockerfile"
          cp deploy/zeabur_bybit_demo_validation/entrypoint.sh "$CTX/entrypoint.sh" || true
          cp -r tools/ci "$CTX/tools/" || true
          # Bake Founder V2 gate file — entrypoint set -a sources this and overwrites
          # stale Zeabur FOUNDER_GATE leftovers (e.g. FIRST_BYBIT_DEMO_SMOKE_ORDER).
          cp deploy/zeabur_bybit_demo_validation/demo_founder_gate.env "$CTX/demo_founder_gate.env"
          # Bake commit identity into image (overrides stale NEXUS_DEPLOYMENT_ID labels).
          echo "$GITHUB_SHA" > "$CTX/DEPLOYMENT_COMMIT"
          echo "$GITHUB_SHA" > "$CTX/SOURCE_COMMIT"
          grep -n "DEMO_AUTONOMOUS_6H_V2_BOUNDED_VALIDATION" "$CTX/backend/nexus_demo_execution/session_limits.py"
          grep -n "FOUNDER_GATE=DEMO_AUTONOMOUS_6H_V2_BOUNDED_VALIDATION" "$CTX/demo_founder_gate.env"
          grep -q "BoundedAutonomousSessionEngine" "$CTX/backend/nexus_demo_execution/bounded_12h_session.py"
          ! grep -q "_run_placeholder" "$CTX/backend/nexus_demo_execution/bounded_12h_session.py"
          grep -q "account/forensic" "$CTX/backend/nexus_demo_execution/api_routes.py"
          grep -q "persistence/stream/status" "$CTX/backend/nexus_demo_execution/api_routes.py"
          grep -q "session_finalizer" "$CTX/backend/nexus_demo_execution/session_finalizer.py"
          test -s "$CTX/DEPLOYMENT_COMMIT"
          echo "baked_commit=$(tr -d '\r\n' < "$CTX/DEPLOYMENT_COMMIT")"
          (
            cd "$CTX"
            zeabur deploy --project-id "$ZEABUR_PROJECT_ID" --service-id "$VALIDATION_SERVICE_ID" -i=false --json
          ) > /tmp/deploy_out.txt 2>&1
          sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' /tmp/deploy_out.txt | tail -n 40
          grep -q '"status": "success"' /tmp/deploy_out.txt
      - name: Re-arm FOUNDER_GATE after deploy and restart
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          SID="$VALIDATION_SERVICE_ID"
          ENV_ID="$ZEABUR_ENV_ID"
          # Prefer -k key=value form (CLI rejects --key on some versions).
          zeabur variable update --id "$SID" -k "FOUNDER_GATE=DEMO_AUTONOMOUS_6H_V2_BOUNDED_VALIDATION" -y -i=false \
            || zeabur variable create --id "$SID" -k "FOUNDER_GATE=DEMO_AUTONOMOUS_6H_V2_BOUNDED_VALIDATION" -y -i=false
          zeabur variable update --id "$SID" -k "FOUNDER_6H_APPROVED=true" -y -i=false \
            || zeabur variable create --id "$SID" -k "FOUNDER_6H_APPROVED=true" -y -i=false
          zeabur service restart --id "$SID" --env-id "$ENV_ID" -i=false
          sleep 75
          # Prove process sees V2 gate via GET (do not POST start here).
          curl -fsS "$DEMO_VAL_URL/api/nexus/demo-execution/status" > /tmp/probe_gate.json
          python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/probe_gate.json"))
          env=(d.get("founder_env") or {})
          gate=str(env.get("FOUNDER_GATE") or "")
          approved=str(env.get("FOUNDER_6H_APPROVED") or "").lower()
          print("probe_env", {"FOUNDER_GATE": gate, "FOUNDER_6H_APPROVED": approved})
          if gate == "FIRST_BYBIT_DEMO_SMOKE_ORDER":
              print("STALE_FOUNDER_GATE_STILL_SMOKE")
              sys.exit(1)
          if "6H_V2" not in gate and "6H_BOUNDED" not in gate:
              print("unexpected FOUNDER_GATE", gate)
              sys.exit(1)
          if approved not in {"true", "1", "yes", "on"}:
              print("FOUNDER_6H_APPROVED missing")
              sys.exit(1)
          print("probe_gate_ok")
          PY
      - name: Wait health ready
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" "$DEMO_VAL_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "health_ok attempt=$i"
              cat /tmp/h.json | head -c 200
              exit 0
            fi
            echo "wait_health attempt=$i code=$code"
            sleep 10
          done
          exit 1
      - name: Prove forensic routes + deployment commit
        run: |
          set -euo pipefail
          EXP="${{ github.sha }}"
          EXP12="${EXP:0:12}"
          for i in $(seq 1 24); do
            fcode=$(curl -s -o /tmp/forensic.json -w "%{http_code}" "$DEMO_VAL_URL/api/nexus/demo-execution/account/forensic" || true)
            scode=$(curl -s -o /tmp/stream_status.json -w "%{http_code}" "$DEMO_VAL_URL/api/nexus/demo-execution/persistence/stream/status" || true)
            ecode=$(curl -s -o /tmp/stream_events.json -w "%{http_code}" "$DEMO_VAL_URL/api/nexus/demo-execution/persistence/stream/events?limit=1" || true)
            curl -fsS "$DEMO_VAL_URL/api/nexus/demo-execution/status" > /tmp/st.json || true
            python - "$fcode" "$scode" "$ecode" "$EXP12" <<'PY'
          import json, sys
          fcode, scode, ecode, exp12 = sys.argv[1:5]
          try:
              st = json.load(open("/tmp/st.json", encoding="utf-8"))
          except Exception:
              st = {}
          ri = st.get("runtime_identity") or {}
          commit = str(ri.get("deployment_commit") or "")
          print({"forensic": fcode, "stream_status": scode, "stream_events": ecode, "commit": commit, "exp12": exp12})
          ok = fcode == "200" and scode == "200" and ecode == "200" and commit.startswith(exp12)
          raise SystemExit(0 if ok else 2)
          PY
            if [ $? -eq 0 ]; then
              echo "forensic_routes_live=true"
              exit 0
            fi
            echo "wait_forensic attempt=$i f=$fcode s=$scode e=$ecode"
            sleep 10
          done
          echo "forensic_routes_not_live"
          exit 1
      - name: Deploy-only safety snapshot (no 6H/12H start)
        run: |
          set -euo pipefail
          curl -fsS "$DEMO_VAL_URL/health" > /tmp/h.json
          curl -fsS "$DEMO_VAL_URL/api/nexus/demo-execution/account?fresh=true" > /tmp/acct.json
          curl -fsS "$DEMO_VAL_URL/api/nexus/demo-execution/status" > /tmp/st.json
          python - <<'PY'
          import json
          a=json.load(open("/tmp/acct.json"))
          s=json.load(open("/tmp/st.json"))
          print("positions", a.get("open_positions"), "orders", a.get("open_orders"), "write", a.get("exchange_write"), "mainnet", a.get("mainnet"))
          assert a.get("mainnet") is not True
          assert a.get("real_money") is not True
          assert a.get("exchange_write") is not True
          print("deploy_only_ok FOUNDER_GATE", (s.get("founder_env") or {}).get("FOUNDER_GATE"))
          PY
          echo "auto_start_6h=false"
          echo "auto_start_12h=false"
          echo "24h_gate_approved=false"
          echo "recommendation=NEXUS_SAME_ROUTER_PROBE_DEPLOYING" >> "$GITHUB_STEP_SUMMARY"

  start-6h-optional:
    needs: [gate-and-prepare, arm-and-deploy]
    if: needs.gate-and-prepare.outputs.allow_live_start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST start bounded 6H V2 (explicit live_start only)
        run: |
          set -euo pipefail
          echo "LIVE_START was requested — this path is NOT used for same-router probe deploy."
          echo "Refusing silent 6H start during observability/probe wave unless Founder re-approves."
          exit 1

  # ---------------------------------------------------------------------------
  # Founder: full 12H engine deploy + optional extended observation start
  # ---------------------------------------------------------------------------
  full-12h-engine:
    if: ${{ github.event.inputs.founder_approval_phrase == 'APPROVE_NEXUS_DEMO_12H_V3_EXTENDED_OBSERVATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Service guard
        run: |
          test "${{ github.event.inputs.expected_service_id }}" = "$VALIDATION_SERVICE_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt flask pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Full-engine tests + no placeholder
        env:
          PYTHONPATH: ${{ github.workspace }}
          FOUNDER_APPROVE_12H_AFTER_INCONCLUSIVE_6H_AND_PROBE: "true"
          MAINNET: "false"
          REAL_MONEY: "false"
        run: |
          ! grep -q "_run_placeholder" backend/nexus_demo_execution/bounded_12h_session.py
          python -m pytest tests/test_12h_full_autonomous_engine.py tests/test_demo_6h_12h_session_engine.py -q --tb=line
          python - <<'PY'
          import json
          from pathlib import Path
          from backend.nexus_demo_execution.v3_extended_observation_gate import evaluate_extended_observation_gate, EXACT_PHRASE
          from backend.nexus_demo_execution.v3_start_gate import evaluate_12h_machine_gate
          pack=json.loads(Path("artifacts/demo_validation_12h_v3/extended_observation_source_pack.json").read_text(encoding="utf-8"))
          ordinary=evaluate_12h_machine_gate({**pack, "runtime_recommendation_sot":"DEMO_AUTONOMOUS_6H_V2_INCONCLUSIVE_NO_EXECUTION","recommendation":"DEMO_AUTONOMOUS_6H_V2_INCONCLUSIVE_NO_EXECUTION","proposed_12h_session_id":"12h-y"})
          assert ordinary["machine_gate_pass"] is False
          gate=evaluate_extended_observation_gate(pack, approval_phrase=EXACT_PHRASE)
          assert gate["gate_pass"] is True
          assert gate["6h_pass"] is False
          print("extended_gate_ok")
          PY
      - run: npm i -g zeabur@latest
      - name: Arm 12H env (write closed)
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          SID="$VALIDATION_SERVICE_ID"
          SHA="${{ github.event.inputs.expected_runtime_sha }}"
          if [ -z "$SHA" ] || [ "$SHA" = "auto" ]; then SHA="$GITHUB_SHA"; fi
          set_var() { zeabur variable update --id "$SID" -k "${1}=${2}" -y -i=false || zeabur variable create --id "$SID" -k "${1}=${2}" -y -i=false; }
          set_var MAINNET false
          set_var REAL_MONEY false
          set_var EXCHANGE_WRITE false
          set_var DEMO_AUTONOMOUS_ENABLED false
          set_var FOUNDER_GATE DEMO_AUTONOMOUS_12H_V3_BOUNDED_VALIDATION
          set_var FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3 true
          set_var FOUNDER_APPROVE_12H_AFTER_INCONCLUSIVE_6H_AND_PROBE true
          set_var NEXUS_DEPLOYMENT_ID "$SHA"
          set_var NEXUS_DEPLOYMENT_COMMIT "$SHA"
          set_var NEXUS_SOURCE_COMMIT "$SHA"
          set_var NEXUS_DEPLOY_RUN_ID "$GITHUB_RUN_ID"
          set_var GITHUB_SHA "$SHA"
      - name: Deploy Validation full engine
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          cd frontend && npm ci && npm run build && cd ..
          CTX=/tmp/12h_full_ctx
          rm -rf "$CTX" && mkdir -p "$CTX/tools"
          cp app.py run.py gunicorn.conf.py zbpack.json requirements.txt "$CTX/"
          cp -r backend config static templates "$CTX/"
          mkdir -p "$CTX/static/operator_ui"
          cp -r frontend/dist/* "$CTX/static/operator_ui/" || true
          cp deploy/zeabur_bybit_demo_validation/Dockerfile "$CTX/Dockerfile"
          cp deploy/zeabur_bybit_demo_validation/entrypoint.sh "$CTX/entrypoint.sh"
          cp deploy/zeabur_bybit_demo_validation/demo_founder_gate.env "$CTX/demo_founder_gate.env"
          cp -r tools/ci "$CTX/tools/" || true
          echo "$GITHUB_SHA" > "$CTX/DEPLOYMENT_COMMIT"
          echo "$GITHUB_SHA" > "$CTX/SOURCE_COMMIT"
          grep -q "BoundedAutonomousSessionEngine" "$CTX/backend/nexus_demo_execution/bounded_12h_session.py"
          ! grep -q "_run_placeholder" "$CTX/backend/nexus_demo_execution/bounded_12h_session.py"
          cp deploy/zeabur_bybit_demo_validation/Dockerfile.full_engine "$CTX/Dockerfile"
          test -s "$CTX/DEPLOYMENT_COMMIT"
          grep -q "BOUNDED_AUTONOMOUS_ENGINE_V1" "$CTX/backend/nexus_demo_execution/api_routes.py"
          ( cd "$CTX" && zeabur deploy --project-id "$ZEABUR_PROJECT_ID" --service-id "$VALIDATION_SERVICE_ID" -i=false --json ) > /tmp/deploy_out.txt 2>&1
          sed -E 's/[A-Za-z0-9_+\/-]{40,}/***REDACTED***/g' /tmp/deploy_out.txt | tail -n 40
          grep -q '"status": "success"' /tmp/deploy_out.txt
      - name: Restart + re-arm 12H gate + wait for new code + T+0/60/180
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          SID="$VALIDATION_SERVICE_ID"
          zeabur variable update --id "$SID" -k "FOUNDER_GATE=DEMO_AUTONOMOUS_12H_V3_BOUNDED_VALIDATION" -y -i=false \
            || zeabur variable create --id "$SID" -k "FOUNDER_GATE=DEMO_AUTONOMOUS_12H_V3_BOUNDED_VALIDATION" -y -i=false
          zeabur variable update --id "$SID" -k "FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3=true" -y -i=false \
            || zeabur variable create --id "$SID" -k "FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3=true" -y -i=false
          zeabur variable update --id "$SID" -k "FOUNDER_APPROVE_12H_AFTER_INCONCLUSIVE_6H_AND_PROBE=true" -y -i=false \
            || zeabur variable create --id "$SID" -k "FOUNDER_APPROVE_12H_AFTER_INCONCLUSIVE_6H_AND_PROBE=true" -y -i=false
          zeabur service restart --id "$SID" --env-id "$ZEABUR_ENV_ID" -i=false
          echo "waiting for FULL_AUTONOMOUS_ENGINE code marker"
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/st_wait.json -w "%{http_code}" "$DEMO_VAL_URL/api/nexus/demo-execution/status" || true)
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/st_wait.json"))
          print("try", d.get("code_marker"), d.get("bounded_12h_controller_type"), (d.get("baked_deployment_commit") or "")[:12])
          sys.exit(0 if d.get("bounded_12h_controller_type")=="FULL_AUTONOMOUS_ENGINE" and d.get("code_marker")=="BOUNDED_AUTONOMOUS_ENGINE_V1" else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            echo "wait_code_rollout attempt=$i http=$code"
            sleep 15
          done
          test "$ready" = "1"
          # Re-arm after new entrypoint (gaps-only) is live, then restart once more so FOUNDER_GATE sticks.
          zeabur variable update --id "$SID" -k "FOUNDER_GATE=DEMO_AUTONOMOUS_12H_V3_BOUNDED_VALIDATION" -y -i=false
          zeabur service restart --id "$SID" --env-id "$ZEABUR_ENV_ID" -i=false
          sleep 60
          for label in t0 t60 t180; do
            code=$(curl -s -o /tmp/h_${label}.json -w "%{http_code}" "$DEMO_VAL_URL/health" || true)
            echo "health_${label}=$code"
            test "$code" = "200"
            curl -fsS "$DEMO_VAL_URL/api/nexus/demo-execution/status" > /tmp/st_${label}.json
            python - <<PY
          import json,sys
          d=json.load(open("/tmp/st_${label}.json"))
          assert d.get("code_marker")=="BOUNDED_AUTONOMOUS_ENGINE_V1", d.get("code_marker")
          assert d.get("bounded_12h_controller_type")=="FULL_AUTONOMOUS_ENGINE", d.get("bounded_12h_controller_type")
          assert d.get("bounded_12h_full_engine_ready") is True
          assert d.get("placeholder_reference_count", 0)==0
          assert d.get("mainnet") is False and d.get("real_money") is False
          ident=d.get("runtime_identity") or {}
          print("identity", ident.get("identity_class"), (ident.get("deployment_commit") or "")[:12], "baked", (d.get("baked_deployment_commit") or "")[:12])
          if ident.get("identity_class")=="RUNTIME_IDENTITY_LABEL_STALE":
              sys.exit(2)
          print("ok_${label}")
          PY
            if [ "$label" = "t0" ]; then sleep 60; fi
            if [ "$label" = "t60" ]; then sleep 120; fi
          done
      - name: Conditional 12H start
        if: ${{ github.event.inputs.start_12h_after_deploy == 'true' }}
        run: |
          set -euo pipefail
          BODY=$(python - <<'PY'
          import json
          from pathlib import Path
          pack=json.loads(Path("artifacts/demo_validation_12h_v3/extended_observation_source_pack.json").read_text(encoding="utf-8"))
          pack["session_nonce"]="""${{ github.event.inputs.session_nonce }}"""
          pack["approval_phrase"]="APPROVE_NEXUS_DEMO_12H_V3_EXTENDED_OBSERVATION"
          pack["exact_phrase"]="APPROVE_NEXUS_DEMO_12H_V3_EXTENDED_OBSERVATION"
          print(json.dumps({"source_6h_report": pack, "session_nonce": pack["session_nonce"], "approval_phrase": pack["approval_phrase"], "exact_phrase": pack["exact_phrase"]}))
          PY
          )
          curl -fsS -X POST "$DEMO_VAL_URL/api/nexus/demo-execution/bounded-12h/start" \
            -H "Content-Type: application/json" -d "$BODY" > /tmp/12h_start.json
          python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/12h_start.json"))
          print(json.dumps(d, indent=2, default=str)[:4000])
          if not d.get("ok"):
              sys.exit(1)
          assert str(d.get("session_id","")).startswith("NEXUS-DEMO-12H-V3-")
          PY
          curl -fsS "$DEMO_VAL_URL/api/nexus/demo-execution/bounded-12h/status" > /tmp/12h_st.json
          python - <<'PY'
          import json,sys
          d=json.load(open("/tmp/12h_st.json"))
          print({k:d.get(k) for k in ("status","session_id","thread_alive","deadline_ts","session_write_enabled","controller_type")})
          assert d.get("thread_alive") is True
          assert d.get("status") in {"RUNNING","STARTING"}
          PY
