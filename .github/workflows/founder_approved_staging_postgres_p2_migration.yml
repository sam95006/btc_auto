name: founder-approved-staging-postgres-p2-migration

# One-shot, schema-only staging migration. No exchange execution.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_NEXUS_STAGING_P2_MIGRATION_0007 to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-staging-postgres-p2-migration
  cancel-in-progress: false

env:
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf
  FORBIDDEN_STAGE3: 6a3b81652fdef84a45a2a553
  FORBIDDEN_MEMBER_PREVIEW: 69d559cb2696d526abde8cda
  FORBIDDEN_MEMBER_PREVIEW_V18: 6a744ba3472e2c91a9e728a8

jobs:
  migrate-p2-0007:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Confirm schema-only migration intent
        run: test "${{ github.event.inputs.confirm }}" = "APPLY_NEXUS_STAGING_P2_MIGRATION_0007"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build pinned P2 migration Zeabur CLI
        run: |
          set -euo pipefail
          bash deploy/zeabur_p2_migration_cli/build_p2_zeabur_cli.sh
          echo "P2_PINNED_ZEABUR_CLI_IMPLEMENTED=true"
          echo "P2_PINNED_CLI_DIRECT_MARKER_BINARY_PROOF=true"
          echo "P2_MIGRATION_DEPLOYMENT_LIST_AUTHORITY=false"
          zeabur version || true

      - name: Run offline migration qualification tests + historical P1/P2 regression lock
        env:
          PYTHONPATH: ${{ github.workspace }}
          MAINNET: "false"
          REAL_MONEY: "false"
          DEMO_AUTONOMOUS_ENABLED: "false"
          AUTONOMOUS_SEND: "false"
          EXCHANGE_WRITE: "false"
        run: |
          pip install -r requirements.txt pytest
          python -m tools.ci.p2_historical_p1_p2_regression_lock
          echo "HISTORICAL_P1_P2_REGRESSION_LOCK=PASS"

      - name: Verify required secret presence only
        env:
          NEXUS_STAGING_POSTGRES_URL: ${{ secrets.NEXUS_STAGING_POSTGRES_URL }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
        run: |
          set -euo pipefail
          python tools/ci/p1_mask_dsn.py
          test -n "${NEXUS_STAGING_POSTGRES_URL:-}"
          test -n "${ZEABUR_TOKEN:-}"
          test -n "${ZEABUR_PROJECT_ID:-}"
          echo "P2_MIGRATION_SECRET_BOUNDARY_PASS=true"

      - name: Build migration deployment context before service create
        id: context
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CTX=/tmp/p2_migration_ctx
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.ci.p2_migration_bootstrap import build_migration_context, validate_migration_context
          ctx = build_migration_context(
              repo_root=Path(os.environ["GITHUB_WORKSPACE"]),
              destination=Path("/tmp/p2_migration_ctx"),
              github_sha=os.environ["GITHUB_SHA"],
          )
          meta = validate_migration_context(ctx, expected_sha=os.environ["GITHUB_SHA"])
          print(f"migration_context_built=true deployment_commit_prefix={meta['deployment_commit_prefix']}")
          print(f"dsn_baked_in_image={meta['dsn_baked_in_image']}")
          PY
          test -s "$CTX/DEPLOYMENT_COMMIT"
          test -s "$CTX/SOURCE_COMMIT"
          test -s "$CTX/tools/ci/p2_staging_migration_0007.py"
          echo "context_dir=$CTX" >> "$GITHUB_OUTPUT"
          echo "P2_MIGRATION_CONTEXT_BUILT_BEFORE_SERVICE_CREATE=true"

      - name: Create run-scoped migration service with single migration-context deploy
        id: resolve
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          ZEABUR_ENV_ID: ${{ env.ZEABUR_ENV_ID }}
          LEARNING_VALIDATION_SERVICE_ID: ${{ secrets.ZEABUR_DEMO_VALIDATION_SERVICE_ID }}
          FORBIDDEN_SERVICE_IDS: ${{ env.FORBIDDEN_STAGE3 }},${{ env.FORBIDDEN_MEMBER_PREVIEW }},${{ env.FORBIDDEN_MEMBER_PREVIEW_V18 }},${{ secrets.ZEABUR_API_STAGING_SERVICE_ID }},${{ secrets.ZEABUR_DEMO_VALIDATION_SERVICE_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          P2_MIGRATION_SERVICE_NAME: nexus-p2m7-${{ github.run_id }}-${{ github.run_attempt }}
          P2_MIGRATION_CONTEXT_DIR: ${{ steps.context.outputs.context_dir }}
        run: |
          set -euo pipefail
          echo "P2_MIGRATION_SERVICE_NAME=${P2_MIGRATION_SERVICE_NAME}"
          echo "P2_MIGRATION_CONTEXT_DIR=${P2_MIGRATION_CONTEXT_DIR}"
          test -n "${ZEABUR_ENV_ID:-}"
          echo "P2_MIGRATION_CREATE_ENV_EXPLICIT=true"
          echo "create_env_id_prefix=$(printf '%s' "$ZEABUR_ENV_ID" | cut -c1-6)"
          case "${P2_MIGRATION_SERVICE_NAME}" in
            nexus-p2m7-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}) ;;
            *) echo "BLOCKER_service_name_not_run_scoped"; exit 1 ;;
          esac
          test "${P2_MIGRATION_SERVICE_NAME}" != "nexus-p2-migration-0007"
          test -d "${P2_MIGRATION_CONTEXT_DIR}"
          set +e
          SID=$(python -m tools.ci.ensure_p2_migration_zeabur_service 2>/tmp/p2_migration_create.stderr)
          CREATE_HELPER_EXIT=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          from tools.ci.p2_migration_bootstrap import sanitize_create_helper_stderr
          text = Path("/tmp/p2_migration_create.stderr").read_text(encoding="utf-8", errors="replace")
          sanitized = sanitize_create_helper_stderr(text)
          if sanitized:
              print(sanitized)
          PY
          echo "P2_MIGRATION_CREATE_HELPER_EXIT=${CREATE_HELPER_EXIT}"
          echo "P2_MIGRATION_CREATE_DIAGNOSTIC_VISIBLE=true"
          if [ "$CREATE_HELPER_EXIT" -ne 0 ]; then
            echo "BLOCKER_create_helper_failed"
            exit 1
          fi
          test -n "$SID"
          echo "service_id=$SID" >> "$GITHUB_OUTPUT"
          echo "service_name=${P2_MIGRATION_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "P2_MIGRATION_SERVICE_ID_PREFIX=$(printf '%s' "$SID" | cut -c1-6)"
          echo "P2_MIGRATION_RUN_SCOPED_SERVICE=true"
          echo "P2_MIGRATION_PREVIOUS_SERVICE_REUSED=false"
          echo "P2_MIGRATION_SERVICE_CREATE_COUNT=1"
          echo "P2_MIGRATION_BOOTSTRAP_LOCAL_DEPLOY_COUNT=1"
          echo "P2_MIGRATION_SINGLE_DEPLOY_BOOTSTRAP=true"
          echo "P2_MIGRATION_BOOTSTRAP_DEPLOY_COUNT=1"
          echo "P2_MIGRATION_CREATE_ENV_EXPLICIT=true"
          echo "P2_MIGRATION_SECOND_SERVICE_CREATED=false"
          echo "P2_MIGRATION_DEDICATED_SERVICE_RESOLVED=true"
          BOOTSTRAP_DEPLOYMENT_ID=$(grep -E '^P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_ID=' /tmp/p2_migration_create.stderr | tail -1 | cut -d= -f2-)
          test -n "${BOOTSTRAP_DEPLOYMENT_ID:-}"
          echo "bootstrap_deployment_id=${BOOTSTRAP_DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "bootstrap_deployment_id=${BOOTSTRAP_DEPLOYMENT_ID}"
          echo "bootstrap_deployment_id_prefix=$(printf '%s' "$BOOTSTRAP_DEPLOYMENT_ID" | cut -c1-6)"
          echo "P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_ID=${BOOTSTRAP_DEPLOYMENT_ID}"
          echo "P2_MIGRATION_DEPLOY_OUTPUT_DEPLOYMENT_ID_AUTHORITY=true"
          echo "P2_ZEABUR_DEPLOYMENT_ID_DIRECT_FROM_UPLOAD=true"
          echo "P2_MIGRATION_DEPLOYMENT_LIST_AUTHORITY=false"

      - name: Wait for bootstrap deployment ready before runtime variables
        id: bootstrap_ready
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          BOOTSTRAP_DEPLOYMENT_ID: ${{ steps.resolve.outputs.bootstrap_deployment_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "${SERVICE_ID:-}"
          test -n "${BOOTSTRAP_DEPLOYMENT_ID:-}"
          test -n "${ZEABUR_ENV_ID:-}"
          echo "bootstrap_deployment_id=${BOOTSTRAP_DEPLOYMENT_ID}"
          echo "deployment_phase=bootstrap"
          MAX_ATTEMPTS=12
          RETRY_INTERVAL=10
          attempt=1
          STALL_COUNT=0
          PRIOR_HASH=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            : > /tmp/p2_migration_bootstrap_deployment_get.json
            : > /tmp/p2_migration_bootstrap_build.log
            set +e
            zeabur deployment get --deployment-id "$BOOTSTRAP_DEPLOYMENT_ID" --json -i=false >/tmp/p2_migration_bootstrap_deployment_get.json 2>&1
            GET_EXIT=$?
            zeabur deployment log -t=build --deployment-id "$BOOTSTRAP_DEPLOYMENT_ID" -i=false >/tmp/p2_migration_bootstrap_build.log 2>&1
            BUILD_EXIT=$?
            python -m tools.ci.p2_migration_deployment_phase \
              --evaluate-phase \
              --target-deployment-id "$BOOTSTRAP_DEPLOYMENT_ID" \
              --phase bootstrap \
              --deployment-get-file /tmp/p2_migration_bootstrap_deployment_get.json \
              --build-log-file /tmp/p2_migration_bootstrap_build.log \
              --prior-build-hash "$PRIOR_HASH" \
              --stall-count "$STALL_COUNT" \
              --emit-env >/tmp/p2_migration_bootstrap_phase.json
            PHASE_EXIT=$?
            set -e
            PRIOR_HASH=$(python -c "import json; print(json.load(open('/tmp/p2_migration_bootstrap_phase.json'))['build_log_progress_hash'])")
            STALL_COUNT=$(python -c "import json; print(json.load(open('/tmp/p2_migration_bootstrap_phase.json'))['stall_count'])")
            echo "bootstrap_phase_attempt=${attempt} classifier_exit=${PHASE_EXIT} deployment_get_exit=${GET_EXIT} build_exit=${BUILD_EXIT}"
            cat /tmp/p2_migration_bootstrap_phase.json
            if [ "$PHASE_EXIT" = 0 ]; then
              echo "P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_READY=true"
              echo "BOOTSTRAP_DEPLOYMENT_READY_GATE_IMPLEMENTED=true"
              echo "bootstrap_finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "bootstrap_phase_json_path=/tmp/p2_migration_bootstrap_phase.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$PHASE_EXIT" = 2 ]; then
              sleep "$RETRY_INTERVAL"
              attempt=$((attempt + 1))
              continue
            fi
            if grep -q 'P2_MIGRATION_BUILD_STALLED=true' /tmp/p2_migration_bootstrap_phase.json; then
              echo "P2_MIGRATION_BUILD_STALLED=true"
              exit 1
            fi
            if grep -q 'P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_SUPERSEDED=true' /tmp/p2_migration_bootstrap_phase.json; then
              echo "P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_SUPERSEDED=true"
              exit 1
            fi
            echo "BLOCKER_bootstrap_deployment_not_ready"
            exit 1
          done
          echo "P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_WAIT_TIMEOUT=true"
          exit 1

      - name: Inject disarmed runtime variables after bootstrap deployment ready
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          NEXUS_STAGING_POSTGRES_URL: ${{ secrets.NEXUS_STAGING_POSTGRES_URL }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "${SERVICE_ID:-}"
          test -n "${ZEABUR_ENV_ID:-}"
          set_var() {
            local k="$1" v="$2"
            zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "${k}=${v}" -y -i=false >/tmp/p2_migration_var.out 2>&1 ||
              zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "${k}=${v}" -y -i=false >/tmp/p2_migration_var.out 2>&1
          }
          set_var MAINNET false
          set_var REAL_MONEY false
          set_var DEMO_AUTONOMOUS_ENABLED false
          set_var AUTONOMOUS_SEND false
          set_var EXCHANGE_WRITE false
          set_var NEXUS_PG_RUNTIME_ENABLED true
          set_var NEXUS_ENV STAGING
          set_var NEXUS_DATA_DIR /tmp/nexus_p2_migration_0007
          set_var NEXUS_POSTGRES_URL "$NEXUS_STAGING_POSTGRES_URL"
          set_var P2_MIGRATION_SERVICE_NAME "${{ steps.resolve.outputs.service_name }}"
          echo "P2_MIGRATION_RUNTIME_VARS_INJECTED_AFTER_SINGLE_DEPLOY=true"
          echo "P2_MIGRATION_RUNTIME_VARS_INJECTED_AFTER_BOOTSTRAP_READY=true"
          echo "P2_MIGRATION_SECOND_SERVICE_CREATED=false"

      - name: Activation local deploy to same service after runtime variables
        id: activation
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          BOOTSTRAP_DEPLOYMENT_ID: ${{ steps.resolve.outputs.bootstrap_deployment_id }}
          P2_MIGRATION_CONTEXT_DIR: ${{ steps.context.outputs.context_dir }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "${SERVICE_ID:-}"
          test -n "${ZEABUR_ENV_ID:-}"
          test -n "${ZEABUR_PROJECT_ID:-}"
          test -d "${P2_MIGRATION_CONTEXT_DIR}"
          # Hard gate: activation cannot start while bootstrap deployment is not ready.
          python -m tools.ci.p2_migration_deployment_phase \
            --can-start-activation \
            --bootstrap-phase-json /tmp/p2_migration_bootstrap_phase.json \
            --emit-env >/tmp/p2_migration_activation_gate.json
          GATE_EXIT=$?
          cat /tmp/p2_migration_activation_gate.json
          if [ "$GATE_EXIT" -ne 0 ]; then
            echo "P2_MIGRATION_ACTIVATION_BEFORE_BOOTSTRAP_READY_BLOCKED=true"
            echo "BLOCKER_activation_before_bootstrap_ready"
            exit 1
          fi
          echo "P2_MIGRATION_ACTIVATION_BEFORE_BOOTSTRAP_READY_BLOCKED=false"
          echo "activation_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Prove baked source identity in the exact upload context before local deploy.
          python - <<'PY'
          import os, sys
          from tools.ci.p2_migration_bootstrap import verify_context_source_identity
          result = verify_context_source_identity(
              context_dir=os.environ["P2_MIGRATION_CONTEXT_DIR"],
              expected_sha=os.environ["GITHUB_SHA"],
          )
          print(f"P2_MIGRATION_POST_VAR_SOURCE_IDENTITY_PASS={str(result['ok']).lower()}")
          print(f"deployment_commit_prefix={result['deployment_commit_prefix']}")
          print(f"source_commit_prefix={result['source_commit_prefix']}")
          if not result["ok"]:
              print("BLOCKER_post_var_source_identity_mismatch")
              sys.exit(1)
          PY
          # Flags verified via: zeabur deploy --help → --project-id --service-id --environment-id
          # Local-project activation upload onto EXISTING service (never --create, never service redeploy).
          set +e
          (
            cd "${P2_MIGRATION_CONTEXT_DIR}"
            zeabur deploy \
              --project-id "$ZEABUR_PROJECT_ID" \
              --service-id "$SERVICE_ID" \
              --environment-id "$ZEABUR_ENV_ID" \
              -i=false \
              --json
          ) >/tmp/p2_migration_activation_deploy.out 2>&1
          DEPLOY_EXIT=$?
          set -e
          cat /tmp/p2_migration_activation_deploy.out
          echo "post_var_local_deploy_exit=${DEPLOY_EXIT}"
          set +e
          python -m tools.ci.p2_migration_lifecycle_command \
            --classify-lifecycle-file /tmp/p2_migration_activation_deploy.out \
            --exit-code "$DEPLOY_EXIT" \
            --operation local-deploy \
            --expected-service-id "$SERVICE_ID" \
            --expected-environment-id "$ZEABUR_ENV_ID" \
            --emit-env >/tmp/p2_migration_activation_deploy_class.json
          CLASS_EXIT=$?
          set -e
          cat /tmp/p2_migration_activation_deploy_class.json
          if [ "$CLASS_EXIT" -ne 0 ]; then
            echo "P2_MIGRATION_POST_VAR_LOCAL_DEPLOY=false"
            echo "P2_MIGRATION_POST_VAR_LOCAL_DEPLOY_COMMAND_PASS=false"
            echo "P2_MIGRATION_POST_VAR_LOCAL_DEPLOY_COUNT=0"
            echo "BLOCKER_post_var_local_deploy_failed"
            exit 1
          fi
          python -m tools.ci.p2_migration_deployment_phase \
            --evaluate-pinned-deploy \
            --deploy-output-file /tmp/p2_migration_activation_deploy.out \
            --deploy-exit "$DEPLOY_EXIT" \
            --expected-service-id "$SERVICE_ID" \
            --expected-environment-id "$ZEABUR_ENV_ID" \
            --expected-project-id "$ZEABUR_PROJECT_ID" \
            --phase activation \
            --bootstrap-deployment-id "$BOOTSTRAP_DEPLOYMENT_ID" \
            --emit-env >/tmp/p2_migration_activation_pinned_deploy.json
          PINNED_EXIT=$?
          cat /tmp/p2_migration_activation_pinned_deploy.json
          if [ "$PINNED_EXIT" -ne 0 ]; then
            echo "BLOCKER_activation_deploy_missing_direct_deployment_id"
            exit 1
          fi
          ACTIVATION_DEPLOYMENT_ID=$(python -c "import json; print(json.load(open('/tmp/p2_migration_activation_pinned_deploy.json'))['deployment_id'])")
          test -n "${ACTIVATION_DEPLOYMENT_ID:-}"
          test "${ACTIVATION_DEPLOYMENT_ID}" != "${BOOTSTRAP_DEPLOYMENT_ID}"
          echo "activation_deployment_id=${ACTIVATION_DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "activation_deployment_id=${ACTIVATION_DEPLOYMENT_ID}"
          echo "activation_deployment_id_prefix=$(printf '%s' "$ACTIVATION_DEPLOYMENT_ID" | cut -c1-6)"
          echo "P2_MIGRATION_ACTIVATION_DEPLOYMENT_ID=${ACTIVATION_DEPLOYMENT_ID}"
          echo "P2_MIGRATION_DEPLOY_OUTPUT_DEPLOYMENT_ID_AUTHORITY=true"
          echo "P2_ZEABUR_DEPLOYMENT_ID_DIRECT_FROM_UPLOAD=true"
          echo "P2_MIGRATION_DEPLOYMENT_LIST_AUTHORITY=false"
          echo "P2_MIGRATION_POST_VAR_LOCAL_DEPLOY=true"
          echo "P2_MIGRATION_POST_VAR_LOCAL_DEPLOY_COMMAND_PASS=true"
          echo "P2_MIGRATION_POST_VAR_LOCAL_DEPLOY_COUNT=1"
          echo "P2_MIGRATION_ACTIVATION_LOCAL_DEPLOY_COUNT=1"
          echo "P2_MIGRATION_BOOTSTRAP_LOCAL_DEPLOY_COUNT=1"
          echo "P2_MIGRATION_SERVICE_CREATE_COUNT=1"
          echo "P2_MIGRATION_TOTAL_LOCAL_DEPLOY_COUNT=2"
          echo "P2_MIGRATION_SECOND_SERVICE_CREATED=false"

      - name: Wait for exact activation deployment ready
        id: activation_ready
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          BOOTSTRAP_DEPLOYMENT_ID: ${{ steps.resolve.outputs.bootstrap_deployment_id }}
          ACTIVATION_DEPLOYMENT_ID: ${{ steps.activation.outputs.activation_deployment_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "${SERVICE_ID:-}"
          test -n "${ACTIVATION_DEPLOYMENT_ID:-}"
          test -n "${BOOTSTRAP_DEPLOYMENT_ID:-}"
          echo "activation_deployment_id=${ACTIVATION_DEPLOYMENT_ID}"
          echo "deployment_phase=activation"
          MAX_ATTEMPTS=12
          RETRY_INTERVAL=10
          attempt=1
          STALL_COUNT=0
          PRIOR_HASH=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            : > /tmp/p2_migration_activation_deployment_get.json
            : > /tmp/p2_migration_activation_build.log
            set +e
            zeabur deployment get --deployment-id "$ACTIVATION_DEPLOYMENT_ID" --json -i=false >/tmp/p2_migration_activation_deployment_get.json 2>&1
            GET_EXIT=$?
            zeabur deployment log -t=build --deployment-id "$ACTIVATION_DEPLOYMENT_ID" -i=false >/tmp/p2_migration_activation_build.log 2>&1
            BUILD_EXIT=$?
            python -m tools.ci.p2_migration_deployment_phase \
              --evaluate-phase \
              --target-deployment-id "$ACTIVATION_DEPLOYMENT_ID" \
              --phase activation \
              --deployment-get-file /tmp/p2_migration_activation_deployment_get.json \
              --build-log-file /tmp/p2_migration_activation_build.log \
              --bootstrap-deployment-id "$BOOTSTRAP_DEPLOYMENT_ID" \
              --activation-started \
              --prior-build-hash "$PRIOR_HASH" \
              --stall-count "$STALL_COUNT" \
              --emit-env >/tmp/p2_migration_activation_phase.json
            PHASE_EXIT=$?
            set -e
            PRIOR_HASH=$(python -c "import json; print(json.load(open('/tmp/p2_migration_activation_phase.json'))['build_log_progress_hash'])")
            STALL_COUNT=$(python -c "import json; print(json.load(open('/tmp/p2_migration_activation_phase.json'))['stall_count'])")
            echo "activation_phase_attempt=${attempt} classifier_exit=${PHASE_EXIT} deployment_get_exit=${GET_EXIT} build_exit=${BUILD_EXIT}"
            cat /tmp/p2_migration_activation_phase.json
            if [ "$PHASE_EXIT" = 0 ]; then
              echo "P2_MIGRATION_ACTIVATION_DEPLOYMENT_READY=true"
              echo "EXACT_DEPLOYMENT_ID_STATUS_AUTHORITY=true"
              exit 0
            fi
            if [ "$PHASE_EXIT" = 2 ]; then
              sleep "$RETRY_INTERVAL"
              attempt=$((attempt + 1))
              continue
            fi
            if grep -q 'P2_MIGRATION_BUILD_STALLED=true' /tmp/p2_migration_activation_phase.json; then
              echo "P2_MIGRATION_BUILD_STALLED=true"
              exit 1
            fi
            if grep -q 'P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_SUPERSEDED=true' /tmp/p2_migration_activation_phase.json; then
              echo "P2_MIGRATION_BOOTSTRAP_DEPLOYMENT_SUPERSEDED=true"
              exit 1
            fi
            echo "BLOCKER_activation_deployment_not_ready"
            exit 1
          done
          echo "P2_MIGRATION_ACTIVATION_DEPLOYMENT_WAIT_TIMEOUT=true"
          exit 1

      - name: Metadata diagnostic and explicit-negative veto
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          SERVICE_NAME: ${{ steps.resolve.outputs.service_name }}
          ACTIVATION_DEPLOYMENT_ID: ${{ steps.activation.outputs.activation_deployment_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          mkdir -p artifacts/bybit_demo_p1
          test -n "${ACTIVATION_DEPLOYMENT_ID:-}"
          # Parent deployment --help may list subcommands only; never use it for selector flags.
          set +e
          zeabur deployment get --help >/tmp/zeabur_deployment_get_help.txt 2>&1
          GET_HELP_EXIT=$?
          zeabur deployment log --help >/tmp/zeabur_deployment_log_help.txt 2>&1
          LOG_HELP_EXIT=$?
          zeabur deployment list --help >/tmp/zeabur_deployment_list_help.txt 2>&1
          LIST_HELP_EXIT=$?
          python -m tools.ci.p2_migration_deployment_diagnostics \
            --parse-get-help-file /tmp/zeabur_deployment_get_help.txt \
            --parse-log-help-file /tmp/zeabur_deployment_log_help.txt \
            --parse-list-help-file /tmp/zeabur_deployment_list_help.txt \
            --get-help-exit "$GET_HELP_EXIT" \
            --log-help-exit "$LOG_HELP_EXIT" \
            --list-help-exit "$LIST_HELP_EXIT" \
            >/tmp/zeabur_deployment_cli_contract.json
          PARSE_EXIT=$?
          set -e
          echo "zeabur_deployment_get_help_exit=${GET_HELP_EXIT}"
          echo "zeabur_deployment_log_help_exit=${LOG_HELP_EXIT}"
          echo "zeabur_deployment_list_help_exit=${LIST_HELP_EXIT}"
          echo "zeabur_deployment_cli_contract_parse_exit=${PARSE_EXIT}"
          cat /tmp/zeabur_deployment_cli_contract.json
          PREFERRED=$(python -c "import json; print(json.load(open('/tmp/zeabur_deployment_cli_contract.json'))['preferred_selector'])")
          SUPPORTS_LIST=$(python -c "import json; print('true' if json.load(open('/tmp/zeabur_deployment_cli_contract.json'))['supports_deployment_list'] else 'false')")
          echo "zeabur_cli_preferred_selector=${PREFERRED}"
          echo "P2_MIGRATION_DEPLOYMENT_SELECTOR=${PREFERRED}"
          echo "zeabur_cli_supports_deployment_list=${SUPPORTS_LIST}"
          if [ "$PREFERRED" != "service-id" ]; then
            echo "BLOCKER_zeabur_deployment_cli_selector_unsupported"
            exit 1
          fi
          # Single-shot exact activation deployment authority (no BUILDING→PASS).
          : > /tmp/p2_migration_deployment_get.json
          : > /tmp/p2_migration_deployment_list.json
          : > /tmp/p2_migration_build.log
          : > /tmp/p2_migration_runtime.log
          : > /tmp/p2_migration_service_get.json
          set +e
          zeabur deployment get --deployment-id "$ACTIVATION_DEPLOYMENT_ID" --json -i=false >/tmp/p2_migration_activation_exact_get.json 2>&1
          EXACT_GET_EXIT=$?
          zeabur service get --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false >/tmp/p2_migration_service_get.json 2>&1
          SERVICE_GET_EXIT=$?
          zeabur deployment log -t=build --deployment-id "$ACTIVATION_DEPLOYMENT_ID" -i=false >/tmp/p2_migration_build.log 2>&1
          BUILD_EXIT=$?
          zeabur deployment log -t=runtime --deployment-id "$ACTIVATION_DEPLOYMENT_ID" -i=false >/tmp/p2_migration_runtime.log 2>&1
          RUNTIME_EXIT=$?
          if [ "$SUPPORTS_LIST" = "true" ]; then
            zeabur deployment list --service-id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false >/tmp/p2_migration_deployment_list.json 2>&1
            LIST_EXIT=$?
            echo "deployment_list_skipped=false"
            echo "P2_MIGRATION_DEPLOYMENT_LIST_AUTHORITY=false"
          else
            echo '{"skipped":"deployment_list_optional"}' >/tmp/p2_migration_deployment_list.json
            LIST_EXIT=0
            echo "deployment_list_skipped=true"
          fi
          cp /tmp/p2_migration_activation_exact_get.json /tmp/p2_migration_deployment_get.json
          GET_EXIT=$EXACT_GET_EXIT
          python -m tools.ci.p2_migration_deployment_phase \
            --evaluate-phase \
            --target-deployment-id "$ACTIVATION_DEPLOYMENT_ID" \
            --phase activation \
            --deployment-get-file /tmp/p2_migration_activation_exact_get.json \
            --build-log-file /tmp/p2_migration_build.log \
            --emit-env >/tmp/p2_migration_metadata_activation_phase.json
          ACTIVATION_PHASE_EXIT=$?
          set -e
          echo "activation_exact_phase_exit=${ACTIVATION_PHASE_EXIT}"
          cat /tmp/p2_migration_metadata_activation_phase.json
          if [ "$ACTIVATION_PHASE_EXIT" -ne 0 ]; then
            echo "P2_MIGRATION_METADATA_VETO_FAIL_CLOSED=true"
            exit 1
          fi
          echo "deployment_get_exit=${GET_EXIT}"
          echo "service_get_exit=${SERVICE_GET_EXIT}"
          echo "deployment_list_exit=${LIST_EXIT}"
          echo "build_log_exit=${BUILD_EXIT}"
          echo "runtime_log_exit=${RUNTIME_EXIT}"
          python -m tools.ci.p2_migration_deployment_diagnostics \
            --deployment-get /tmp/p2_migration_deployment_get.json \
            --deployment-list /tmp/p2_migration_deployment_list.json \
            --build-log /tmp/p2_migration_build.log \
            --runtime-log /tmp/p2_migration_runtime.log \
            --service-get /tmp/p2_migration_service_get.json \
            --deployment-get-exit "$GET_EXIT" \
            --deployment-list-exit "$LIST_EXIT" \
            --build-log-exit "$BUILD_EXIT" \
            --runtime-log-exit "$RUNTIME_EXIT" \
            --service-get-exit "$SERVICE_GET_EXIT" \
            --emit-env \
            --write-artifact artifacts/bybit_demo_p1/p2_migration_deployment_diagnostics.json \
            >/tmp/p2_migration_deployment_class.out
          cat /tmp/p2_migration_deployment_class.out
          echo "P2_MIGRATION_DEPLOYMENT_STATUS_MARKER_PRESENT=true"
          echo "P2_MIGRATION_SERVICE_STATUS_MARKER_PRESENT=true"
          echo "P2_MIGRATION_BUILD_STATUS_MARKER_PRESENT=true"
          echo "P2_MIGRATION_RUNTIME_STATUS_MARKER_PRESENT=true"
          echo "P2_MIGRATION_BUILD_LOG_TAIL_MARKER_PRESENT=true"
          echo "P2_MIGRATION_RUNTIME_LOG_TAIL_MARKER_PRESENT=true"
          echo "P2_MIGRATION_METADATA_PROCEED_TO_OPERATIONAL=true"
          echo "DUPLICATE_METADATA_RUNNING_GATE_REMOVED=true"
          echo "OLD_CANCELED_DEPLOYMENT_ISOLATED=true"
          echo "activation_deployment_id=${ACTIVATION_DEPLOYMENT_ID}"

      - name: Require deployment record before service-exec
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          ACTIVATION_DEPLOYMENT_ID: ${{ steps.activation.outputs.activation_deployment_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          test -n "${SERVICE_ID:-}"
          test -n "${ZEABUR_ENV_ID:-}"
          test -n "${ACTIVATION_DEPLOYMENT_ID:-}"
          echo "activation_deployment_id=${ACTIVATION_DEPLOYMENT_ID}"
          MAX_ATTEMPTS=12
          RETRY_INTERVAL=10
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            : > /tmp/p2_migration_deployment_record_get.json
            : > /tmp/p2_migration_deployment_record_list.json
            set +e
            zeabur deployment get --deployment-id "$ACTIVATION_DEPLOYMENT_ID" --json -i=false >/tmp/p2_migration_deployment_record_get.json 2>&1
            DEPLOYMENT_GET_EXIT=$?
            echo '{"audit_only":"deployment_list_not_authority"}' >/tmp/p2_migration_deployment_record_list.json
            DEPLOYMENT_LIST_EXIT=0
            python -m tools.ci.p2_migration_lifecycle_command \
              --deployment-record \
              --deployment-get-file /tmp/p2_migration_deployment_record_get.json \
              --deployment-list-file /tmp/p2_migration_deployment_record_list.json \
              --deployment-get-exit "$DEPLOYMENT_GET_EXIT" \
              --deployment-list-exit "$DEPLOYMENT_LIST_EXIT" \
              --target-deployment-id "$ACTIVATION_DEPLOYMENT_ID" \
              --emit-env >/tmp/p2_migration_deployment_record.json
            RECORD_EXIT=$?
            set -e
            echo "deployment_record_attempt=${attempt} classifier_exit=${RECORD_EXIT}"
            echo "DEPLOYMENT_GET_EXIT=${DEPLOYMENT_GET_EXIT}"
            echo "DEPLOYMENT_LIST_EXIT=${DEPLOYMENT_LIST_EXIT}"
            cat /tmp/p2_migration_deployment_record.json
            if [ "$RECORD_EXIT" = 0 ]; then
              echo "P2_MIGRATION_DEPLOYMENT_RECORD_PRESENT=true"
              exit 0
            fi
            echo "P2_MIGRATION_DEPLOYMENT_RECORD_PRESENT=false"
            sleep "$RETRY_INTERVAL"
            attempt=$((attempt + 1))
          done
          echo "P2_MIGRATION_DEPLOYMENT_RECORD_PRESENT=false"
          echo "BLOCKER_deployment_record_absent_before_service_exec"
          exit 1

      - name: Operational service-exec readiness
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          EXPECTED="${GITHUB_SHA}"
          MAX_ATTEMPTS=12
          RETRY_INTERVAL=5
          STREAK_NEEDED=3
          STREAK_GAP=2
          streak=0
          attempt=1
          not_running_count=0
          positive_proof_count=0
          python -m tools.ci.p2_migration_rollout_readiness --print-remote-script > /tmp/p2_migration_current_image_probe.sh
          SCRIPT_B64=$(base64 -w0 /tmp/p2_migration_current_image_probe.sh)
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            : > /tmp/p2_migration_readiness_probe.out
            set +e
            zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
              /bin/sh -lc "EXPECTED='$EXPECTED'; export EXPECTED; APP_ROOT=/app; export APP_ROOT; printf '%s' '$SCRIPT_B64' | base64 -d | /bin/sh" >/tmp/p2_migration_readiness_probe.out 2>&1
            CODE=$?
            set -e
            echo "attempt=${attempt} transport_exit=${CODE}"
            printf '%s\n' "$(grep -E '^(expected_sha_prefix|baked_sha_prefix|source_sha_prefix|helper_present|safety_flags_ok|P2_MIGRATION_CURRENT_IMAGE_PROBE_PASS|P2_MIGRATION_OPERATIONAL_READINESS_PASS)=' /tmp/p2_migration_readiness_probe.out || true)"
            set +e
            python -m tools.ci.p2_migration_rollout_readiness --classify-file /tmp/p2_migration_readiness_probe.out --expected "$EXPECTED" --exit-code "$CODE" >/tmp/p2_migration_readiness_class.json
            CLASS_CODE=$?
            set -e
            cat /tmp/p2_migration_readiness_class.json
            if [ "$CLASS_CODE" = 3 ]; then
              echo "P2_MIGRATION_OPERATIONAL_HARD_FAIL=true"
              echo "current_image_streak=0"
              exit 1
            fi
            if grep -qE 'NOT_RUNNING_SERVICE|Inactive service|This service is not in the running state' /tmp/p2_migration_readiness_probe.out; then
              streak=0
              not_running_count=$((not_running_count + 1))
              echo "P2_MIGRATION_SERVICE_NOT_RUNNING_YET=true"
              echo "current_image_streak=0"
              sleep "$RETRY_INTERVAL"
            elif [ "$CLASS_CODE" = 0 ] && grep -q 'P2_MIGRATION_OPERATIONAL_READINESS_PASS=true' /tmp/p2_migration_readiness_probe.out; then
              streak=$((streak + 1))
              positive_proof_count=$((positive_proof_count + 1))
              echo "current_image_streak=${streak}"
              if [ "$streak" -ge "$STREAK_NEEDED" ]; then
                echo "P2_MIGRATION_OPERATIONAL_READINESS_PASS=true"
                echo "P2_MIGRATION_DEPLOYMENT_CONVERGED=true"
                echo "fresh_migration_service_ready=true"
                exit 0
              fi
              sleep "$STREAK_GAP"
            elif grep -q 'execute command failed' /tmp/p2_migration_readiness_probe.out; then
              streak=0
              echo "P2_MIGRATION_READINESS_CLI_ERROR=true"
              echo "current_image_streak=0"
              sleep "$RETRY_INTERVAL"
            else
              streak=0
              echo "current_image_streak=0"
              echo "FRESH_SERVICE_OPERATIONAL_NOT_READY_YET"
              sleep "$RETRY_INTERVAL"
            fi
            attempt=$((attempt + 1))
          done
          echo "P2_MIGRATION_DEPLOYMENT_CONVERGED=false"
          echo "P2_MIGRATION_OPERATIONAL_READINESS_PASS=false"
          echo "fresh_migration_service_operational_fail_closed=true"
          echo "readiness_attempts=${MAX_ATTEMPTS}"
          echo "not_running_count=${not_running_count}"
          echo "current_image_positive_proof_count=${positive_proof_count}"
          echo "service_id_prefix=$(printf '%s' "$SERVICE_ID" | cut -c1-6)"
          echo "service_name=${{ steps.resolve.outputs.service_name }}"
          exit 1

      - name: Require final disarmed runtime with ledger DSN
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          READY=false
          for attempt in 1 2 3 4 5 6 7 8; do
            set +e
            zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
              /bin/sh -lc 'test -n "${NEXUS_POSTGRES_URL:-}" && test "${MAINNET:-}" = false && test "${REAL_MONEY:-}" = false && test "${DEMO_AUTONOMOUS_ENABLED:-}" = false && test "${AUTONOMOUS_SEND:-}" = false && test "${EXCHANGE_WRITE:-}" = false' >/tmp/p2_migration_ready.out 2>&1
            CODE=$?
            set -e
            if [ "$CODE" = 0 ]; then READY=true; break; fi
            sleep 5
          done
          test "$READY" = true
          echo "P2_MIGRATION_RUNTIME_READY=true"

      - name: Prove authoritative service-exec stdout transport
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          MARKER="P2_MIGRATION_STDOUT_PROBE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          set +e
          zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            /bin/sh -lc "printf '%s\n' '$MARKER'" >/tmp/p2_migration_stdout_probe.out 2>&1
          set -e
          echo "stdout_probe_bytes=$(wc -c </tmp/p2_migration_stdout_probe.out)"
          grep -F "$MARKER" /tmp/p2_migration_stdout_probe.out
          echo "P2_MIGRATION_SERVICE_EXEC_STDOUT_PASS=true"
          echo "file_channel_authoritative=false"

      - name: Audit file channel without blocking migration
        continue-on-error: true
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          MARKER_PATH="/tmp/nexus_p2_migration_0007/p2_migration_file_audit_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.txt"
          MARKER="P2_MIGRATION_FILE_AUDIT_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          set +e
          zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            /bin/sh -lc "printf '%s' '$MARKER' > '$MARKER_PATH'" >/tmp/p2_migration_file_audit_exec.out 2>&1
          set -e
          ENCODED_PATH=$(jq -rn --arg value "$MARKER_PATH" '$value|@uri')
          AVAILABLE=false
          LAST_HTTP=0
          LAST_BYTES=0
          for attempt in 1 2 3; do
            rm -f /tmp/p2_migration_file_audit_download.txt
            set +e
            HTTP_CODE=$(curl --silent --show-error --output /tmp/p2_migration_file_audit_download.txt \
              --write-out '%{http_code}' -H "Authorization: Bearer $ZEABUR_TOKEN" \
              "https://api.zeabur.com/projects/${ZEABUR_PROJECT_ID}/services/${SERVICE_ID}/files?path=${ENCODED_PATH}&environment=${ZEABUR_ENV_ID}" || true)
            set -e
            BYTES=$(wc -c < /tmp/p2_migration_file_audit_download.txt 2>/dev/null || echo 0)
            LAST_HTTP=$HTTP_CODE
            LAST_BYTES=$BYTES
            echo "file_channel_audit_attempt=${attempt} http_status=${HTTP_CODE} bytes=${BYTES}"
            if [ "$HTTP_CODE" = 200 ] && [ "$BYTES" -gt 0 ] && cmp -s /tmp/p2_migration_file_audit_download.txt <(printf '%s' "$MARKER"); then
              AVAILABLE=true
              break
            fi
            sleep 1
          done
          echo "P2_MIGRATION_FILE_CHANNEL_AUDIT=true"
          echo "P2_MIGRATION_FILE_CHANNEL_AVAILABLE=${AVAILABLE}"
          echo "file_channel_http_status=${LAST_HTTP} file_channel_bytes=${LAST_BYTES}"
          echo "file_channel_authoritative=false"
          echo "file_channel_control_failure=false"
          # Never fail closed on empty/missing/200+0 file API responses.

      - name: Apply and verify only migration 0007 through atomic same-exec
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/bybit_demo_p1
          EVIDENCE_PATH="/tmp/nexus_p2_migration_0007/p2_migration_0007_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          . tools/ci/p1_validation_runtime.sh
          p1_export_disarmed_flags
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          python tools/ci/p2_migration_atomic.py --print-remote-script > /tmp/p2_migration_atomic_remote.sh
          SCRIPT_B64=$(base64 -w0 /tmp/p2_migration_atomic_remote.sh)
          MAX_ATTEMPTS=3
          RETRY_INTERVAL=5
          attempt=1
          PYTHON_STARTED=false
          : > /tmp/p2_migration_service_exec.out
          echo "remote_trigger=zeabur_service_exec_atomic_p2_migration"
          echo "file_channel_authoritative=false"
          echo "python -m tools.ci.p2_staging_migration_0007"
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            : > /tmp/p2_atomic_attempt.out
            set +e
            zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
              /bin/sh -lc "EXPECTED='${GITHUB_SHA}'; export EXPECTED; APP_ROOT=/app; export APP_ROOT; P2_MIGRATION_EVIDENCE_PATH='$EVIDENCE_PATH'; export P2_MIGRATION_EVIDENCE_PATH; PYTHONPATH=/app; export PYTHONPATH; printf '%s' '$SCRIPT_B64' | base64 -d | /bin/sh" >/tmp/p2_atomic_attempt.out 2>&1
            EXEC_CODE=$?
            set -e
            echo "atomic_exec_attempt=${attempt} transport_exit=${EXEC_CODE}"
            cat /tmp/p2_atomic_attempt.out >> /tmp/p2_migration_service_exec.out
            printf '%s\n' "$(grep -E '^(P2_MIGRATION_|expected_sha_prefix|baked_sha_prefix|source_sha_prefix|helper_present)=' /tmp/p2_atomic_attempt.out || true)"
            if grep -q 'P2_MIGRATION_PYTHON_STARTED=true' /tmp/p2_atomic_attempt.out; then
              PYTHON_STARTED=true
              echo "P2_MIGRATION_PYTHON_STARTED=true"
              echo "atomic_migration_retry_after_python_start=false"
              break
            fi
            if grep -q 'P2_MIGRATION_EXEC_POD_NOT_CURRENT=true' /tmp/p2_atomic_attempt.out; then
              echo "P2_MIGRATION_EXEC_POD_NOT_CURRENT=true"
              echo "stale_pod_pre_python_retry_allowed=true"
              sleep "$RETRY_INTERVAL"
              attempt=$((attempt + 1))
              continue
            fi
            echo "pre_python_non_stale_failure=true"
            break
          done
          echo "python_started=${PYTHON_STARTED}"
          echo "service_exec_output_bytes=$(wc -c </tmp/p2_migration_service_exec.out)"
          python -m tools.ci.p2_migration_parse_service_exec /tmp/p2_migration_service_exec.out
          python tools/ci/p2_parse_migration_stdout.py < /tmp/p2_migration_service_exec.out | tee artifacts/bybit_demo_p1/p2_migration_stdout_diagnostic.txt
          set +e
          python -m tools.ci.p2_extract_migration_authoritative_stdout \
            --input /tmp/p2_migration_service_exec.out \
            --out artifacts/bybit_demo_p1/p2_migration_0007_evidence.json
          AUTH_CODE=$?
          set -e
          echo "authoritative_stdout_extractor_exit=${AUTH_CODE}"
          ENCODED_PATH=$(jq -rn --arg value "$EVIDENCE_PATH" '$value|@uri')
          rm -f artifacts/bybit_demo_p1/p2_migration_0007_file_channel_copy.json
          HTTP_CODE=$(curl --silent --show-error --output artifacts/bybit_demo_p1/p2_migration_0007_file_channel_copy.json \
            --write-out '%{http_code}' -H "Authorization: Bearer $ZEABUR_TOKEN" \
            "https://api.zeabur.com/projects/${ZEABUR_PROJECT_ID}/services/${SERVICE_ID}/files?path=${ENCODED_PATH}&environment=${ZEABUR_ENV_ID}" || true)
          BYTES=$(wc -c < artifacts/bybit_demo_p1/p2_migration_0007_file_channel_copy.json 2>/dev/null || echo 0)
          echo "file_channel_http_status=${HTTP_CODE} file_channel_bytes=${BYTES} file_channel_authoritative=false"
          test "$AUTH_CODE" = 0
          python -c "import json,sys; p=json.load(open(sys.argv[1])); assert p.get('P2_MIGRATION_0007_APPLIED_PASS') is True; assert p.get('exchange_write_call_count') == 0; assert p.get('create_order_calls') == 0; print('P2_MIGRATION_0007_APPLIED_PASS=true')" artifacts/bybit_demo_p1/p2_migration_0007_evidence.json

      - name: Upload sanitized migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-postgres-p2-migration-0007-evidence
          path: artifacts/bybit_demo_p1/
          if-no-files-found: warn

      - name: Always disarm and clear transient migration DSN
        if: always()
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_ID:-}" || exit 0
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          for pair in MAINNET=false REAL_MONEY=false DEMO_AUTONOMOUS_ENABLED=false AUTONOMOUS_SEND=false EXCHANGE_WRITE=false NEXUS_PG_RUNTIME_ENABLED=false; do
            zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$pair" -y -i=false >/tmp/p2_migration_cleanup.out 2>&1 ||
              zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$pair" -y -i=false >/tmp/p2_migration_cleanup.out 2>&1
          done
          zeabur variable delete --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k NEXUS_POSTGRES_URL -y -i=false >/tmp/p2_migration_dsn_cleanup.out 2>&1 ||
            zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "NEXUS_POSTGRES_URL=" -y -i=false >/tmp/p2_migration_dsn_cleanup.out 2>&1
