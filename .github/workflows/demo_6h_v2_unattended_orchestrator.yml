name: demo-6h-v2-unattended-orchestrator

# Remote persistent observer for remaining 6H V2 checkpoints, deadline finalize
# watchdog, machine gate, and conditional 12H start.
# Does NOT redeploy Validation.
# Evidence commits target feature branch only. Does NOT rely on Founder laptop / Cursor sleepers.

on:
  workflow_dispatch:
    inputs:
      expected_session_id:
        description: "Source of Truth 6H V2 session id"
        required: true
        default: "NEXUS-DEMO-6H-V2-20260801T091457Z-2350a7d0"
        type: string
      founder_approve_demo_autonomous_12h_v3:
        description: "Must be exact string true (still machine-gated)"
        required: true
        default: "true"
        type: string
      arm_phrase:
        description: "Must equal ARM_UNATTENDED_6H_V2_TO_12H"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: demo-6h-v2-unattended-orchestrator
  cancel-in-progress: false

env:
  MAINNET: "false"
  REAL_MONEY: "false"
  EXCHANGE_WRITE: "false"
  DEMO_AUTONOMOUS_ENABLED: "false"
  DEMO_VAL_URL: https://nexus-bybit-demo-val.zeabur.app
  EXPECTED_6H_SESSION_ID: ${{ github.event.inputs.expected_session_id }}
  FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3: ${{ github.event.inputs.founder_approve_demo_autonomous_12h_v3 }}
  ARTIFACT_DIR: artifacts/demo_validation_6h_v2_unattended
  PYTHONPATH: ${{ github.workspace }}

jobs:
  unattended:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Confirm arm phrase
        run: |
          if [ "${{ github.event.inputs.arm_phrase }}" != "ARM_UNATTENDED_6H_V2_TO_12H" ]; then
            echo "arm phrase mismatch"
            exit 1
          fi
          echo "remote_orchestrator_armed=true"
          echo "local_computer_dependency=false"
          echo "run_id=${{ github.run_id }}"

      - uses: actions/checkout@v4
        with:
          # Workflow file is on main for dispatchability; code/tools come from readiness tip.
          ref: feature/demo-autonomous-6h-v2-readiness

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install flask pytest

      - name: Prove SoT session still RUNNING (GET-only)
        run: |
          python - <<'PY'
          import json, os, urllib.request, sys
          base=os.environ["DEMO_VAL_URL"]
          exp=os.environ["EXPECTED_6H_SESSION_ID"]
          with urllib.request.urlopen(base+"/api/nexus/demo-execution/bounded-6h/status", timeout=45) as r:
              d=json.loads(r.read().decode())
          bb=d.get("bounded_6h") or d
          if isinstance(bb.get("bounded_6h"), dict):
              bb=bb["bounded_6h"]
          print(json.dumps({"session_id": bb.get("session_id"), "status": bb.get("status"), "thread_alive": bb.get("thread_alive"), "cost_gate_blocks": bb.get("cost_gate_blocks"), "candidates_total": bb.get("candidates_total")}, indent=2))
          if bb.get("session_id") != exp:
              print("SESSION_MISMATCH")
              sys.exit(2)
          if bb.get("status") not in {"RUNNING", "STARTING", "COMPLETED", "FAILED", "KILLED"}:
              print("unexpected status")
              sys.exit(2)
          print("sot_ok")
          PY

      - name: Run unattended orchestrator (remote sleeper)
        id: orch
        run: |
          set -euo pipefail
          echo "six_hour_deadline_finalizer_armed=true"
          echo "machine_gate_armed=true"
          echo "conditional_12h_start_armed=true"
          python tools/ci/demo_6h_v2_unattended_orchestrator.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-6h-v2-unattended-${{ github.run_id }}
          path: |
            artifacts/demo_validation_6h_v2_unattended/
            artifacts/demo_validation_6h_v2/
            docs/04_readiness/NEXUS_6H_V2_LIVE_CHECKPOINT_Tplus*.md
            docs/04_readiness/NEXUS_6H_V2_FINAL_REPORT.md
            docs/04_readiness/NEXUS_6H_V2_FINAL_REPORT.md.json
            docs/04_readiness/NEXUS_FOUNDER_RETURN_BRIEF_20260802_0005_TW.md
          if-no-files-found: warn

      - name: Commit evidence back to branch (no secrets)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "nexus-unattended-bot"
          git config user.email "nexus-unattended-bot@users.noreply.github.com"
          git add \
            artifacts/demo_validation_6h_v2_unattended \
            artifacts/demo_validation_6h_v2 \
            docs/04_readiness/NEXUS_6H_V2_LIVE_CHECKPOINT_Tplus3H.md \
            docs/04_readiness/NEXUS_6H_V2_LIVE_CHECKPOINT_Tplus4H.md \
            docs/04_readiness/NEXUS_6H_V2_LIVE_CHECKPOINT_Tplus5H.md \
            docs/04_readiness/NEXUS_6H_V2_FINAL_REPORT.md \
            docs/04_readiness/NEXUS_6H_V2_FINAL_REPORT.md.json \
            docs/04_readiness/NEXUS_FOUNDER_RETURN_BRIEF_20260802_0005_TW.md \
            || true
          if git diff --cached --quiet; then
            echo "no evidence commit"
            exit 0
          fi
          git commit -m "chore(evidence): 6H V2 unattended checkpoints/finalize run ${{ github.run_id }}"
          git push origin HEAD:feature/demo-autonomous-6h-v2-readiness
