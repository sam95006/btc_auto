name: demo-6h-v2-unattended-orchestrator

# Dual-mode remote orchestrator:
# - ARM_UNATTENDED_6H_V2_TO_12H → legacy 6H path (historical)
# - ARM_UNATTENDED_12H_V3 / ARM_UNATTENDED_12H_V3_PHASE_B → 12H V3 GET-only watchdog
# Does NOT redeploy Validation. No local Cursor dependency.

on:
  workflow_dispatch:
    inputs:
      expected_session_id:
        description: "SoT session id (6H or 12H depending on arm_phrase)"
        required: true
        default: "NEXUS-DEMO-12H-V3-20260801T181517Z-12hv3c01"
        type: string
      founder_approve_demo_autonomous_12h_v3:
        description: "Legacy 6H path only"
        required: true
        default: "false"
        type: string
      arm_phrase:
        description: "ARM_UNATTENDED_12H_V3 | ARM_UNATTENDED_12H_V3_PHASE_B | ARM_UNATTENDED_6H_V2_TO_12H"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: demo-unattended-${{ github.event.inputs.arm_phrase }}
  cancel-in-progress: false

env:
  MAINNET: "false"
  REAL_MONEY: "false"
  EXCHANGE_WRITE: "false"
  DEMO_AUTONOMOUS_ENABLED: "false"
  DEMO_VAL_URL: https://nexus-bybit-demo-val.zeabur.app
  EXPECTED_6H_SESSION_ID: ${{ github.event.inputs.expected_session_id }}
  EXPECTED_12H_SESSION_ID: ${{ github.event.inputs.expected_session_id }}
  EXPECTED_12H_STARTED_AT: "2026-08-01T18:15:17Z"
  EXPECTED_12H_DEADLINE: "2026-08-02T06:15:17Z"
  EXPECTED_DEPLOYMENT_COMMIT: "63a4c17d80e988756493bc035beb594157342aa5"
  FOUNDER_APPROVE_DEMO_AUTONOMOUS_12H_V3: ${{ github.event.inputs.founder_approve_demo_autonomous_12h_v3 }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  unattended:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Confirm arm phrase + announce
        id: mode
        run: |
          PHRASE="${{ github.event.inputs.arm_phrase }}"
          case "$PHRASE" in
            ARM_UNATTENDED_12H_V3)
              echo "mode=12h_a" >> "$GITHUB_OUTPUT"
              echo "WATCHDOG_PHASE=A" >> "$GITHUB_ENV"
              echo "ARTIFACT_DIR=artifacts/demo_validation_12h_v3" >> "$GITHUB_ENV"
              ;;
            ARM_UNATTENDED_12H_V3_PHASE_B)
              echo "mode=12h_b" >> "$GITHUB_OUTPUT"
              echo "WATCHDOG_PHASE=B" >> "$GITHUB_ENV"
              echo "CONTINUE_FROM=Tplus8H" >> "$GITHUB_ENV"
              echo "ARTIFACT_DIR=artifacts/demo_validation_12h_v3" >> "$GITHUB_ENV"
              ;;
            ARM_UNATTENDED_6H_V2_TO_12H)
              echo "mode=6h" >> "$GITHUB_OUTPUT"
              echo "ARTIFACT_DIR=artifacts/demo_validation_6h_v2_unattended" >> "$GITHUB_ENV"
              ;;
            *)
              echo "arm phrase mismatch: $PHRASE"
              exit 1
              ;;
          esac
          echo "remote_watchdog_armed=true"
          echo "remote_watchdog_run_id=${{ github.run_id }}"
          echo "local_computer_dependency=false"
          echo "current_session_id=${{ github.event.inputs.expected_session_id }}"
          echo "t15_scheduled=2026-08-01T18:30:17Z"
          echo "t30_scheduled=2026-08-01T18:45:17Z"
          echo "t1h_scheduled=2026-08-01T19:15:17Z"
          echo "t2h_scheduled=2026-08-01T20:15:17Z"
          echo "t4h_scheduled=2026-08-01T22:15:17Z"
          echo "t6h_scheduled=2026-08-02T00:15:17Z"
          echo "t8h_scheduled=2026-08-02T02:15:17Z"
          echo "t10h_scheduled=2026-08-02T04:15:17Z"
          echo "t12h_finalizer_scheduled=2026-08-02T06:15:17Z"
          echo "redeploy=false"
          echo "24H_GATE_APPROVED=false"

      - uses: actions/checkout@v4
        with:
          ref: feature/demo-autonomous-6h-v2-readiness

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install flask

      - name: Prove 12H SoT (GET-only)
        if: steps.mode.outputs.mode == '12h_a' || steps.mode.outputs.mode == '12h_b'
        run: |
          python - <<'PY'
          import json, os, urllib.request, sys
          base=os.environ["DEMO_VAL_URL"]
          exp=os.environ["EXPECTED_12H_SESSION_ID"]
          with urllib.request.urlopen(base+"/api/nexus/demo-execution/bounded-12h/status", timeout=45) as r:
              d=json.loads(r.read().decode())
          bb=d.get("bounded_12h") or d
          if isinstance(bb.get("bounded_12h"), dict):
              bb=bb["bounded_12h"]
          print(json.dumps({k: bb.get(k) for k in ("session_id","status","thread_alive","entries_total","controller_type","remaining_seconds")}, indent=2))
          if bb.get("session_id") != exp:
              print("SESSION_MISMATCH"); sys.exit(2)
          print("sot_ok_12h")
          PY

      - name: Run 12H remote watchdog
        if: steps.mode.outputs.mode == '12h_a' || steps.mode.outputs.mode == '12h_b'
        run: |
          set -euo pipefail
          python tools/ci/demo_12h_v3_unattended_orchestrator.py

      - name: Prove 6H SoT (legacy)
        if: steps.mode.outputs.mode == '6h'
        run: |
          python - <<'PY'
          import json, os, urllib.request, sys
          base=os.environ["DEMO_VAL_URL"]
          exp=os.environ["EXPECTED_6H_SESSION_ID"]
          with urllib.request.urlopen(base+"/api/nexus/demo-execution/bounded-6h/status", timeout=45) as r:
              d=json.loads(r.read().decode())
          bb=d.get("bounded_6h") or d
          if isinstance(bb.get("bounded_6h"), dict):
              bb=bb["bounded_6h"]
          print(json.dumps({"session_id": bb.get("session_id"), "status": bb.get("status")}, indent=2))
          if bb.get("session_id") != exp:
              print("SESSION_MISMATCH"); sys.exit(2)
          print("sot_ok_6h")
          PY

      - name: Run legacy 6H orchestrator
        if: steps.mode.outputs.mode == '6h'
        run: python tools/ci/demo_6h_v2_unattended_orchestrator.py

      - name: Upload 12H artifacts
        if: always() && (steps.mode.outputs.mode == '12h_a' || steps.mode.outputs.mode == '12h_b')
        uses: actions/upload-artifact@v4
        with:
          name: demo-12h-v3-unattended-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            artifacts/demo_validation_12h_v3/
            docs/04_readiness/NEXUS_12H_V3_*
          if-no-files-found: warn

      - name: Commit 12H evidence
        if: always() && (steps.mode.outputs.mode == '12h_a' || steps.mode.outputs.mode == '12h_b')
        run: |
          set -euo pipefail
          git config user.name "nexus-unattended-bot"
          git config user.email "nexus-unattended-bot@users.noreply.github.com"
          git pull --rebase origin feature/demo-autonomous-6h-v2-readiness || true
          git add artifacts/demo_validation_12h_v3 docs/04_readiness/NEXUS_12H_V3_* || true
          if git diff --cached --quiet; then
            echo "no evidence commit"
            exit 0
          fi
          git commit -m "chore(evidence): 12H V3 unattended ${{ steps.mode.outputs.mode }} run ${{ github.run_id }}"
          git push origin HEAD:feature/demo-autonomous-6h-v2-readiness

      - name: Arm Phase B continuation
        if: success() && steps.mode.outputs.mode == '12h_a'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f artifacts/demo_validation_12h_v3/PHASE_B_CONTINUATION_REQUEST.json
          gh workflow run "demo-6h-v2-unattended-orchestrator" \
            --ref feature/demo-autonomous-6h-v2-readiness \
            -f arm_phrase=ARM_UNATTENDED_12H_V3_PHASE_B \
            -f expected_session_id="${{ github.event.inputs.expected_session_id }}" \
            -f founder_approve_demo_autonomous_12h_v3=false
          echo "t8h_scheduled=true"
          echo "t10h_scheduled=true"
          echo "t12h_finalizer_scheduled=true"
          echo "phase_b_continuation_armed=true"
