name: founder-approved-live-member-ui-e2e

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_NEXUS_LIVE_MEMBER_UI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: test "${{ inputs.confirm }}" = "VERIFY_NEXUS_LIVE_MEMBER_UI"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/verify_live_member_deployment.mjs
        working-directory: frontend
        env:
          NEXUS_MEMBER_URL: https://nexus-member-preview-v18-2-1.zeabur.app
