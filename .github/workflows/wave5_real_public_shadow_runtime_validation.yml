name: wave5-real-public-shadow-runtime-validation

# Wave 5 public market shadow — no deploy, no private API, no secrets.

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/wave5-real-public-shadow-runtime"
  pull_request:
    branches:
      - "feature/wave4-product-ui-intelligence"

permissions:
  contents: read

concurrency:
  group: wave5-real-public-shadow-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_MARKET_DATA_ONLY: "true"
  BYBIT_PRIVATE_API: "false"
  EXCHANGE_WRITE: "false"
  MAINNET: "false"
  REAL_MONEY: "false"
  AUTONOMOUS_SEND: "false"
  ARM: "false"
  NEXUS_ZEABUR_CLEAN_OBSERVER: "false"

jobs:
  wave5-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Wave5 security scan
        run: |
          python -c "from backend.nexus_real_shadow.security_scan import assert_package_clean; r=assert_package_clean(); print('violations=', r.violation_count)"

  wave5-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Wave5 + regression pytest
        run: |
          python -m pytest \
            tests/test_wave5_real_public_shadow_runtime.py \
            tests/test_wave4_product_ui_intelligence.py \
            tests/test_wave4_visual_acceptance.py \
            tests/test_wave3_adaptive_policy_learning.py \
            tests/test_wave2_global_market_six_role.py \
            tests/test_wave2_shadow_api_routes.py \
            -q --tb=line
      - name: Compile nexus_real_shadow
        run: python -m compileall -q backend/nexus_real_shadow

  wave5-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Provider fixture contract
        run: |
          python -c "
          from backend.nexus_real_shadow.provider import BybitPublicHttpClient
          c = BybitPublicHttpClient(use_fixtures=True)
          inst = c.fetch_instruments_info()
          tick = c.fetch_tickers()
          assert len(inst) >= 3
          assert 'LINKUSDT' in tick
          print('provider_contract=PASS')
          "

  wave5-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run typecheck

  wave5-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright wave4 regression (functional)
        working-directory: frontend
        run: npx playwright test --grep-invert "@visual|@a11y" --reporter=line
        env:
          CI: "true"

  wave5-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t btc-bot-wave5-shadow:ci .
      - name: Container smoke (shadow runtime status)
        run: |
          docker run -d --name btc-bot-wave5-smoke \
            -e PORT=8080 \
            -e PUBLIC_MARKET_DATA_ONLY=true \
            -e BYBIT_PRIVATE_API=false \
            -e EXCHANGE_WRITE=false \
            -e MAINNET=false \
            -e REAL_MONEY=false \
            -e AUTONOMOUS_SEND=false \
            -e FIXED_LEVERAGE=25 \
            -e AI_CAN_CHANGE_LEVERAGE=false \
            -e EXPLICIT_FIXTURE_MODE=false \
            -e NEXUS_ZEABUR_CLEAN_OBSERVER=false \
            -p 8080:8080 \
            btc-bot-wave5-shadow:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/nexus/shadow/runtime/status >/tmp/w5_status.json 2>/dev/null; then
              ok=1
              break
            fi
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs btc-bot-wave5-smoke | tail -n 80
          if [ "$ok" != "1" ]; then
            echo "container_smoke_failed" >&2
            docker rm -f btc-bot-wave5-smoke
            exit 1
          fi
          echo "container_smoke=PASS"
          docker rm -f btc-bot-wave5-smoke

  wave5-container-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Accelerated public shadow soak (mock transport)
        run: |
          python -c "
          from backend.nexus_real_shadow.soak import run_accelerated_soak
          r = run_accelerated_soak(cycles=5)
          assert r.get('ok') is True or r.get('pass') is True or r.get('cycles_completed', 0) >= 1
          assert int(r.get('exchange_write_call_count', 0) or 0) == 0
          print('wave5_container_soak=PASS', r)
          "
