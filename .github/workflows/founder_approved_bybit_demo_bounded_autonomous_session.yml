name: founder-approved-bybit-demo-bounded-autonomous-session

# First bounded 6H Bybit Demo autonomous session launcher.
# Founder dispatch only ??does NOT run from Cursor.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type START_NEXUS_BYBIT_DEMO_BOUNDED_6H_SESSION to confirm"
        required: true
        type: string
      expected_runtime_sha:
        description: "Exact deployed GITHUB_SHA on validation service"
        required: true
        type: string
      validation_service_id:
        description: "Zeabur service id for nexus-bybit-demo-learning-validation"
        required: true
        default: "6a82a79aa21454a2cf6b0015"
        type: string
      dry_run_activate:
        description: "If true, prepare lease + preflight only (no bounded-6h/start POST)"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: founder-bounded-demo-6h-session
  cancel-in-progress: false

env:
  MAINNET: "false"
  REAL_MONEY: "false"
  EXCHANGE_WRITE: "false"
  DEMO_AUTONOMOUS_ENABLED: "false"
  AUTONOMOUS_SEND: "false"
  DEMO_VAL_URL: https://nexus-bybit-demo-learning-validation.zeabur.app
  SERVICE_NAME: nexus-bybit-demo-learning-validation
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf

jobs:
  launch-bounded-demo-session:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirm bounded 6H session intent
        run: test "${{ github.event.inputs.confirm }}" = "START_NEXUS_BYBIT_DEMO_BOUNDED_6H_SESSION"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regression/freeze gate + bounded session tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests/test_demo_bounded_autonomous_session.py tests/test_bounded_runtime_certified_wiring.py tests/test_bounded_runtime_pre_live_hardening.py -q --tb=line
          python -m tools.ci.bounded_runtime_integration_qualification
          python -m tools.ci.bounded_runtime_pre_live_hardening
          python -m tools.ci.p2_historical_p1_p2_regression_lock
          echo "HISTORICAL_P1_P2_REGRESSION_LOCK=PASS"
          echo "CERTIFIED_SURFACE_FREEZE_CHECK=PASS"

      - name: Prove dedicated validation runtime service identity
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.validation_service_id }}" != ""
          test "${{ github.event.inputs.validation_service_id }}" != "6a3b81652fdef84a45a2a553"
          echo "RUNTIME_SERVICE=nexus-bybit-demo-learning-validation"
          echo "RUNTIME_SERVICE_ID=${{ github.event.inputs.validation_service_id }}"
          echo "MIGRATION_CONTROL_SERVICE_EXCLUDED=true"

      - name: Offline bounded session qualification markers
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.event.inputs.expected_runtime_sha }}
          FOUNDER_BOUNDED_SESSION_PHRASE: START_NEXUS_BYBIT_DEMO_BOUNDED_6H_SESSION
        run: |
          python -m tools.ci.demo_bounded_session_orchestrator qualify --offline
          echo "BOUNDED_DEMO_SESSION_IMPLEMENTED=true"

      - name: Verify control-plane secrets for preflight (no runner Postgres DSN)
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          set -euo pipefail
          # The GitHub runner does NOT hold or require the Postgres DSN. Database
          # preflight runs INSIDE the validation service over the Zeabur private
          # network (next step); PostgreSQL Public Port stays OFF. Only the Zeabur
          # control token is needed here.
          test -n "${ZEABUR_TOKEN:-}"
          echo "GITHUB_RUNNER_POSTGRES_DSN_REQUIRED=no"
          echo "PREFLIGHT_SECRET_BOUNDARY_PASS=true"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Zeabur CLI (deterministic pin)
        run: |
          set -euo pipefail
          # Deterministic pin for this safety-critical control plane — never
          # zeabur@latest (a CLI drift broke `zeabur --version` and skipped the
          # whole preflight). 0.21.0 uses `zeabur version` (bare subcommand).
          npm install -g zeabur@0.21.0
          command -v zeabur
          zeabur version

      - name: In-runtime Postgres preflight inside validation service (sanitized, read-only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ github.event.inputs.validation_service_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/demo_bounded_session
          # Enforce the EXACT canonical validation service id before any exec —
          # never target an arbitrary service (fail closed on empty/other/migration).
          python -c "import sys; from tools.ci.p2_migration_service_identity import assert_canonical_validation_service_id as a; a(sys.argv[1])" "$SERVICE_ID"
          echo "EXACT_VALIDATION_SERVICE_ID_ENFORCED=yes"
          # Explicit headless CLI login BEFORE any service exec (token never echoed).
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false >/dev/null 2>&1
          echo "ZEABUR_AUTH_LOGIN_BEFORE_EXEC=yes"
          # Read-only DB preflight INSIDE the validation service, using its OWN
          # runtime NEXUS_POSTGRES_URL over the Zeabur private network. The runner
          # never holds the DSN; only sanitized markers cross the boundary.
          ALLOWED='^(POSTGRES_AVAILABLE|MIGRATION_0007_PRESENT|DURABLE_LESSONS_READABLE|DURABLE_ORDER_LEDGER_READABLE|NO_UNRESOLVED_ORPHAN_INTENTS|NO_UNKNOWN_OUTCOME_STATE|DURABLE_LEDGER_ENTRY_READY|INRUNTIME_POSTGRES_PREFLIGHT_PASS|VALIDATION_RUNTIME_POSTGRES_MISSING)=(true|false)$'
          set +e
          # Run FROM /app so `python -m tools.ci...` resolves: tools/ + tools/ci/ ship
          # in the full_engine image (COPY tools/) but are namespace packages (no
          # __init__.py), so resolution needs /app as the working dir — a bare exec
          # whose cwd is not /app fails "No module named tools" (empty markers, and the
          # CLI may still report exit 0). Fold stderr into the capture so a masked
          # in-container failure is observable (only sanitized lines are persisted).
          RAW=$(zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            sh -c 'cd /app && python -m tools.ci.inruntime_postgres_preflight' 2>&1)
          EXEC_CODE=$?
          set -e
          # Persist ONLY sanitized marker lines (never raw/unfiltered service output).
          printf '%s\n' "$RAW" | grep -E "$ALLOWED" > artifacts/demo_bounded_session/inruntime_db_preflight.txt || true
          cat artifacts/demo_bounded_session/inruntime_db_preflight.txt
          echo "INRUNTIME_EXEC_EXIT_CODE=${EXEC_CODE}"
          echo "POSTGRES_PREFLIGHT_LOCATION=VALIDATION_SERVICE"
          echo "PUBLIC_POSTGRES_PORT_REQUIRED=no"
          echo "GITHUB_RUNNER_POSTGRES_DSN_REQUIRED=no"
          # Sanitized failure classifier (no raw output, no DSN): if the pass marker
          # is absent, surface ONLY a fixed error-class token so a masked in-container
          # failure (wrong cwd / import error / missing file) is visible without ever
          # echoing $RAW. Does NOT affect the fail-closed decision below.
          if ! grep -q '^INRUNTIME_POSTGRES_PREFLIGHT_PASS=true$' artifacts/demo_bounded_session/inruntime_db_preflight.txt; then
            for sig in ModuleNotFoundError ImportError SyntaxError PermissionError "No such file or directory" "can't open file" Traceback; do
              if printf '%s' "$RAW" | grep -qF "$sig"; then echo "INRUNTIME_EXEC_ERROR_CLASS=${sig}"; fi
            done
            echo "INRUNTIME_MARKER_LINES_CAPTURED=$(grep -c . artifacts/demo_bounded_session/inruntime_db_preflight.txt 2>/dev/null || echo 0)"
          fi
          # Fail closed: require a clean exec AND an explicit pass marker.
          test "${EXEC_CODE}" = "0"
          grep -q '^INRUNTIME_POSTGRES_PREFLIGHT_PASS=true$' artifacts/demo_bounded_session/inruntime_db_preflight.txt

      - name: Run live preflight against validation service
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.event.inputs.expected_runtime_sha }}
          FOUNDER_BOUNDED_SESSION_PHRASE: START_NEXUS_BYBIT_DEMO_BOUNDED_6H_SESSION
        run: |
          set -euo pipefail
          mkdir -p artifacts/demo_bounded_session
          # DB proof consumed from the in-runtime preflight (no runner Postgres DSN).
          python -m tools.ci.demo_bounded_session_preflight \
            --base "$DEMO_VAL_URL" \
            --expected-sha "$GITHUB_SHA" \
            --founder-phrase "$FOUNDER_BOUNDED_SESSION_PHRASE" \
            --db-proof-file artifacts/demo_bounded_session/inruntime_db_preflight.txt \
            --out artifacts/demo_bounded_session/preflight.json
          echo "PREFLIGHT_PASS=true"

      - name: Create bounded session lease and prepare session record
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.event.inputs.expected_runtime_sha }}
          FOUNDER_BOUNDED_SESSION_PHRASE: START_NEXUS_BYBIT_DEMO_BOUNDED_6H_SESSION
        run: |
          set -euo pipefail
          python -m tools.ci.demo_bounded_session_orchestrator prepare \
            --base "$DEMO_VAL_URL" \
            --expected-sha "$GITHUB_SHA" \
            --founder-phrase "$FOUNDER_BOUNDED_SESSION_PHRASE" \
            --lease-file artifacts/demo_bounded_session/active_lease.json \
            > artifacts/demo_bounded_session/prepare.json
          SESSION_ID=$(python - <<'PY'
          import json
          print(json.load(open("artifacts/demo_bounded_session/prepare.json", encoding="utf-8"))["session_id"])
          PY
          )
          echo "session_id=${SESSION_ID}" >> "$GITHUB_ENV"
          echo "SESSION_LEASE_CREATED=true"

      - name: Activate bounded 6H runtime (founder dispatch only)
        if: github.event.inputs.dry_run_activate != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          NEXUS_BOUNDED_SESSION_CONTROL_SECRET: ${{ secrets.NEXUS_BOUNDED_SESSION_CONTROL_SECRET }}
          FOUNDER_BOUNDED_SESSION_PHRASE: START_NEXUS_BYBIT_DEMO_BOUNDED_6H_SESSION
        run: |
          set -euo pipefail
          python -m tools.ci.demo_bounded_session_orchestrator activate \
            --base "$DEMO_VAL_URL" \
            --lease-file artifacts/demo_bounded_session/active_lease.json \
            --founder-phrase "$FOUNDER_BOUNDED_SESSION_PHRASE" \
            > artifacts/demo_bounded_session/activate.json
          echo "BOUNDED_SESSION_ACTIVATED=true"
          echo "TRANSIENT_ZEABUR_ENV_RUNTIME_AUTHORITY_REMOVED=true"

      - name: Upload bounded session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-demo-6h-session-launch
          path: artifacts/demo_bounded_session/
          if-no-files-found: warn
