name: founder-approved-staging-postgres-p2-1-qualification

# One-shot research-only P2.1 Postgres qualification. No exchange execution.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_NEXUS_STAGING_P2_1_POSTGRES_QUALIFICATION to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-staging-postgres-p2-1-qualification
  cancel-in-progress: false

env:
  SERVICE_NAME: nexus-bybit-demo-learning-validation
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf
  FORBIDDEN_STAGE3: 6a3b81652fdef84a45a2a553
  FORBIDDEN_MEMBER_PREVIEW: 69d559cb2696d526abde8cda
  FORBIDDEN_MEMBER_PREVIEW_V18: 6a744ba3472e2c91a9e728a8

jobs:
  qualify-p2-1-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Confirm research-only P2.1 qualification intent
        run: test "${{ github.event.inputs.confirm }}" = "APPLY_NEXUS_STAGING_P2_1_POSTGRES_QUALIFICATION"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g zeabur@latest

      - name: Run offline migration qualification tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          MAINNET: "false"
          REAL_MONEY: "false"
          DEMO_AUTONOMOUS_ENABLED: "false"
          AUTONOMOUS_SEND: "false"
          EXCHANGE_WRITE: "false"
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests/test_p2_1_postgres_qualification.py tests/test_p2_run8_evidence_truth.py tests/test_p2_durable_learning_closure.py -q --tb=line

      - name: Verify required secret presence only
        env:
          NEXUS_STAGING_POSTGRES_URL: ${{ secrets.NEXUS_STAGING_POSTGRES_URL }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
        run: |
          set -euo pipefail
          python tools/ci/p1_mask_dsn.py
          test -n "${NEXUS_STAGING_POSTGRES_URL:-}"
          test -n "${ZEABUR_TOKEN:-}"
          test -n "${ZEABUR_PROJECT_ID:-}"
          echo "P2_1_QUAL_SECRET_BOUNDARY_PASS=true"

      - name: Resolve independent validation service
        id: resolve
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          PRESET_SERVICE_ID: ${{ secrets.ZEABUR_DEMO_VALIDATION_SERVICE_ID }}
          FORBIDDEN_SERVICE_ID: ${{ env.FORBIDDEN_STAGE3 }}
          FORBIDDEN_SERVICE_IDS: ${{ env.FORBIDDEN_STAGE3 }},${{ env.FORBIDDEN_MEMBER_PREVIEW }},${{ env.FORBIDDEN_MEMBER_PREVIEW_V18 }},${{ secrets.ZEABUR_API_STAGING_SERVICE_ID }}
        run: |
          set -euo pipefail
          SID=$(python tools/ci/ensure_demo_validation_zeabur_service.py)
          test -n "$SID"
          echo "service_id=$SID" >> "$GITHUB_OUTPUT"
          echo "P2_1_QUAL_VALIDATION_SERVICE_ID_PASS=true"

      - name: Configure disarmed research qualification boundary and deploy validation image
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          NEXUS_STAGING_POSTGRES_URL: ${{ secrets.NEXUS_STAGING_POSTGRES_URL }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          set_var() {
            local k="$1" v="$2"
            zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "${k}=${v}" -y -i=false >/tmp/p2_1_qual_var.out 2>&1 ||
              zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "${k}=${v}" -y -i=false >/tmp/p2_1_qual_var.out 2>&1
          }
          set_var MAINNET false
          set_var REAL_MONEY false
          set_var DEMO_AUTONOMOUS_ENABLED false
          set_var AUTONOMOUS_SEND false
          set_var EXCHANGE_WRITE false
          set_var NEXUS_PG_RUNTIME_ENABLED true
          set_var NEXUS_ENV STAGING
          set_var NEXUS_DATA_DIR /tmp/nexus_demo_validation
          set_var NEXUS_POSTGRES_URL "$NEXUS_STAGING_POSTGRES_URL"
          CTX=/tmp/p2_1_qual_ctx
          rm -rf "$CTX"; mkdir -p "$CTX/tools"
          cp -a requirements.txt "$CTX/"
          cp -a backend config "$CTX/"
          cp -a tools/ci "$CTX/tools/ci"
          cp deploy/zeabur_bybit_demo_validation/entrypoint.sh "$CTX/entrypoint.sh"
          cp deploy/zeabur_bybit_demo_validation/validation_health_server.py "$CTX/validation_health_server.py"
          cat > "$CTX/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim-bookworm
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PYTHONPATH=/app MAINNET=false REAL_MONEY=false DEMO_AUTONOMOUS_ENABLED=false AUTONOMOUS_SEND=false EXCHANGE_WRITE=false NEXUS_DATA_DIR=/tmp/nexus_demo_validation PORT=8080
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod +x entrypoint.sh
          CMD ["/bin/sh", "./entrypoint.sh"]
          DOCKER
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/p2_1_qual_ctx/Dockerfile")
          p.write_text("\n".join(line[10:] if line.startswith("          ") else line for line in p.read_text().splitlines()) + "\n")
          PY
          (cd "$CTX" && zeabur deploy --project-id "$ZEABUR_PROJECT_ID" --service-id "$SERVICE_ID" -i=false --json) >/tmp/p2_1_qual_deploy.out 2>&1

      - name: Require final disarmed runtime with ledger DSN
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          READY=false
          for attempt in 1 2 3 4 5 6 7 8; do
            set +e
            zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
              /bin/sh -lc 'test -n "${NEXUS_POSTGRES_URL:-}" && test "${MAINNET:-}" = false && test "${REAL_MONEY:-}" = false && test "${DEMO_AUTONOMOUS_ENABLED:-}" = false && test "${AUTONOMOUS_SEND:-}" = false && test "${EXCHANGE_WRITE:-}" = false' >/tmp/p2_1_qual_ready.out 2>&1
            CODE=$?
            set -e
            if [ "$CODE" = 0 ]; then READY=true; break; fi
            sleep 5
          done
          test "$READY" = true
          echo "P2_1_QUAL_RUNTIME_READY=true"

      - name: Prove migration service exec and file download share filesystem
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          MARKER_PATH="/tmp/nexus_demo_validation/p2_1_qual_transport_probe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.txt"
          MARKER="P2_1_QUAL_TRANSPORT_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            /bin/sh -lc "printf '%s' '$MARKER' > '$MARKER_PATH'" >/tmp/p2_1_qual_probe_exec.out 2>&1
          ENCODED_PATH=$(jq -rn --arg value "$MARKER_PATH" '$value|@uri')
          FOUND=false
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/p2_1_qual_transport_probe_download.txt
            HTTP_CODE=$(curl --silent --show-error --output /tmp/p2_1_qual_transport_probe_download.txt \
              --write-out '%{http_code}' -H "Authorization: Bearer $ZEABUR_TOKEN" \
              "https://api.zeabur.com/projects/${ZEABUR_PROJECT_ID}/services/${SERVICE_ID}/files?path=${ENCODED_PATH}&environment=${ZEABUR_ENV_ID}" || true)
            BYTES=$(wc -c < /tmp/p2_1_qual_transport_probe_download.txt 2>/dev/null || echo 0)
            echo "migration_transport_probe_attempt=${attempt} http_status=${HTTP_CODE} bytes=${BYTES}"
            if [ "$HTTP_CODE" = 200 ] && [ "$BYTES" -gt 0 ] && cmp -s /tmp/p2_1_qual_transport_probe_download.txt <(printf '%s' "$MARKER"); then FOUND=true; break; fi
            sleep 2
          done
          test "$FOUND" = true
          echo "P2_1_QUAL_SERVICE_EXEC_FILE_CHANNEL_PASS=true"

      - name: Require qualification helper imports before run
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- \
            /bin/sh -lc 'export PYTHONPATH=/app; python -c "import backend.nexus_persistence_pg.migrate; import backend.nexus_persistence_pg.pool; import tools.ci.p2_1_postgres_qualification; print(\"P2_1_QUAL_IMPORT_PASS=true\")"' >/tmp/p2_1_qual_import_probe.out 2>&1
          echo "P2_1_QUAL_IMPORT_PASS=true"

      - name: Run research-only P2.1 Postgres qualification
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_PROJECT_ID: ${{ secrets.ZEABUR_PROJECT_ID }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/bybit_demo_p1
          EVIDENCE_PATH="/tmp/nexus_demo_validation/p2_1_qualification_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          . tools/ci/p1_validation_runtime.sh
          p1_export_disarmed_flags
          COMMAND="export MAINNET=false REAL_MONEY=false DEMO_AUTONOMOUS_ENABLED=false AUTONOMOUS_SEND=false EXCHANGE_WRITE=false NEXUS_ENV=STAGING NEXUS_PG_RUNTIME_ENABLED=true PYTHONPATH=/app P2_1_QUALIFICATION_EVIDENCE_PATH=${EVIDENCE_PATH}; python -m tools.ci.p2_1_postgres_qualification"
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          set +e
          zeabur service exec --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -i=false -- /bin/sh -lc "$COMMAND" >/tmp/p2_1_qual_exec.out 2>&1
          EXEC_CODE=$?
          set -e
          echo "migration_service_exec_transport_exit=$EXEC_CODE"
          python tools/ci/p2_parse_qualification_stdout.py < /tmp/p2_1_qual_exec.out | tee artifacts/bybit_demo_p1/p2_1_qualification_stdout_diagnostic.txt
          ENCODED_PATH=$(jq -rn --arg value "$EVIDENCE_PATH" '$value|@uri')
          FOUND=false
          for attempt in 1 2 3 4 5 6; do
            rm -f artifacts/bybit_demo_p1/p2_1_qualification_evidence.json
            HTTP_CODE=$(curl --silent --show-error --output artifacts/bybit_demo_p1/p2_1_qualification_evidence.json --write-out '%{http_code}' -H "Authorization: Bearer $ZEABUR_TOKEN" "https://api.zeabur.com/projects/${ZEABUR_PROJECT_ID}/services/${SERVICE_ID}/files?path=${ENCODED_PATH}&environment=${ZEABUR_ENV_ID}" || true)
            BYTES=$(wc -c < artifacts/bybit_demo_p1/p2_1_qualification_evidence.json 2>/dev/null || echo 0)
            echo "migration_evidence_download_attempt=${attempt} http_status=${HTTP_CODE} bytes=${BYTES}"
            if [ "$HTTP_CODE" = 200 ] && [ "$BYTES" -gt 0 ]; then FOUND=true; break; fi
            sleep 2
          done
          test "$FOUND" = true
          python -c "import json,sys; p=json.load(open(sys.argv[1])); assert p.get('P2_1_POSTGRES_QUALIFICATION_PASS') is True; assert p.get('exchange_write_call_count') == 0; assert p.get('create_order_calls') == 0; print('P2_1_POSTGRES_QUALIFICATION_PASS=true')" artifacts/bybit_demo_p1/p2_1_qualification_evidence.json

      - name: Upload sanitized migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-postgres-p2-1-qualification-evidence
          path: artifacts/bybit_demo_p1/
          if-no-files-found: warn

      - name: Always disarm and clear transient qualification DSN
        if: always()
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_ID:-}" || exit 0
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          for pair in MAINNET=false REAL_MONEY=false DEMO_AUTONOMOUS_ENABLED=false AUTONOMOUS_SEND=false EXCHANGE_WRITE=false NEXUS_PG_RUNTIME_ENABLED=false; do
            zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$pair" -y -i=false >/tmp/p2_1_qual_cleanup.out 2>&1 ||
              zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "$pair" -y -i=false >/tmp/p2_1_qual_cleanup.out 2>&1
          done
          zeabur variable delete --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k NEXUS_POSTGRES_URL -y -i=false >/tmp/p2_1_qual_dsn_cleanup.out 2>&1 ||
            zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" -k "NEXUS_POSTGRES_URL=" -y -i=false >/tmp/p2_1_qual_dsn_cleanup.out 2>&1
