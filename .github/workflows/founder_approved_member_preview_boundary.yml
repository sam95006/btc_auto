name: founder-approved-member-preview-boundary

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type FIX_NEXUS_MEMBER_PREVIEW_BOUNDARY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: founder-member-preview-boundary
  cancel-in-progress: false

env:
  SERVICE_ID: 6a744ba3472e2c91a9e728a8
  ZEABUR_ENV_ID: 69d559b6474db8a99d6dd6bf
  DOCKERFILE_PATH: deploy/zeabur_member_preview/Dockerfile

jobs:
  validate-static-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm founder-approved operation
        run: |
          test "${{ inputs.confirm }}" = "FIX_NEXUS_MEMBER_PREVIEW_BOUNDARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check:frontend-runtime-boundary && npm run build
        working-directory: frontend
      - name: Assert static build identity
        run: |
          test -f frontend/dist/build-info.json
          grep -q '"product": "NEXUS_MEMBER_UI_DATA_TRUTH"' frontend/dist/build-info.json
          grep -q '"git_sha": "[0-9a-f]\{7,\}"' frontend/dist/build-info.json
          echo "FRONTEND_BUILD_IDENTITY_PASS"

  configure-existing-member-service:
    needs: validate-static-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g zeabur@latest
      - name: Pin the existing member service to its static Dockerfile
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ZEABUR_TOKEN"
          zeabur auth login --token "$ZEABUR_TOKEN" -i=false
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/member-vars.json
          python - <<'PY' > /tmp/member-var-names.txt
          import json
          raw=json.load(open("/tmp/member-vars.json", encoding="utf-8"))
          names=set()
          def walk(node):
              if isinstance(node, dict):
                  for field in ("key", "name"):
                      value=node.get(field)
                      if isinstance(value, str):
                          names.add(value)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(raw)
          print("\n".join(sorted(names)))
          PY
          if grep -Fxq ZBPACK_DOCKERFILE_PATH /tmp/member-var-names.txt; then
            zeabur variable update --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" \
              -k "ZBPACK_DOCKERFILE_PATH=$DOCKERFILE_PATH" -y -i=false
          else
            zeabur variable create --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" \
              -k "ZBPACK_DOCKERFILE_PATH=$DOCKERFILE_PATH" -y -i=false
          fi
          zeabur variable list --id "$SERVICE_ID" --env-id "$ZEABUR_ENV_ID" --json -i=false > /tmp/member-vars-verified.json
          python - <<'PY'
          import json
          raw=json.load(open("/tmp/member-vars-verified.json", encoding="utf-8"))
          values={}
          def walk(node):
              if isinstance(node, dict):
                  key=node.get("key") or node.get("name")
                  value=node.get("value")
                  if isinstance(key, str) and isinstance(value, str):
                      values[key]=value
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(raw)
          assert values.get("ZBPACK_DOCKERFILE_PATH") == "deploy/zeabur_member_preview/Dockerfile"
          print("MEMBER_PREVIEW_BUILD_BOUNDARY_FIXED")
          PY
